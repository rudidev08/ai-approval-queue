<head>

<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Iris actions page. Everything comes from GET /api/state, polled once a
     minute, every 3 s while a scan or a row is running; the header stamp
     counts from the last successful fetch and turns amber when a fetch
     fails, so a dead service shows as a growing amber age.
     Two layers. The glance layer is a grid of narrow area tiles — icon,
     open-items count, one shorthand status line, amber when something is
     wrong — led by a "queue" tile: the emails, messages and finance icons
     over the total of those three counts. A tile picks the view: the queue
     tile stacks emails, messages and finance (the default), an area tile
     shows that area alone at full depth; report, research, audit and system
     are reachable through their own tiles only. The choice sticks in
     localStorage per device.
     A strip of icon+count chips pins itself under the top bar while the
     tile grid is scrolled out of view, so switching views never needs a
     scroll back up.
     The work layer is seven areas. Each opens with its control row, in the
     console's own row shape: the area's header on the left — icon, name and
     one status line carrying its scan state, then its counts in their
     shortest form ("last ran 1 hr ago, 12 in inbox") — and every key of that
     area on the right, so the title row and the control row are one row.
     Report and research are the exceptions, their headers standing above
     their panels: report's keys pick report parts, so its rows are named
     by hand (unsorted, report), and research has one console row per topic.
     System has no control row — its keys belong to its console rows. The areas: emails (inbox-derived action sets, one
     card per set), messages (save proposals for attachments in the watched
     Apple Messages chats — one row per attachment, a destination dropdown
     and the two-tap save and deny keys, and a hide key once a row is
     saved), finance (the Actual Budget categorization queue —
     one ledger card per source: proposals from email, the newest
     uncategorized transactions, the random older ones; one row per
     transaction — a transaction proposed both from email and by the scan
     renders once, under email, and the count line names the hidden
     duplicates; email rows carry a two-tap hide key and the email group
     label a hide-all key, both dropping proposals only, never
     transactions; the dropdown pre-picks the
     most likely category, the two-tap check key applies it, a checkbox —
     started indeterminate, an explicit on/off is required before the check
     key arms — decides whether the payee rule is also written, a
     chevron key opens the row's extra area: the chat link and an inline
     create-category form, the header's green submit-all key sends
     every valid row in one apply call, and a filed row keeps one hide
     key), finance report (no cards — the part keys pick a part of
     the daily report email, full or one component alone, and the green
     create-preview key builds the picked part, writing nothing and sending
     nothing; the picked key carries a blue outline, and each part's last
     build is cached, so the part keys switch between texts with no new run),
     research (one expandable row per vault web-research topic: cadence and
     last successful run in the row's meta line, an amber "failed ×N" status
     word while the driver's log shows consecutive failures, the green run
     key that starts it now (the finished report arrives by email), and the
     amber delete key that drops its stored report, so the next run starts
     from scratch; a chevron key or a tap opens the row — the topic's
     prompt and the report's text, read from the service on the first open,
     plus the clear key for a failure; the heading line carries the next
     batch time, one stamp for the whole area),
     audit (a key that starts the
     deterministic Hermes audit, the running step in the header, and one card
     per category that came back with findings — clean and dismissed
     categories are counted in the header line and named in its tooltip),
     and system (a console: one row per thing —
     the gateway, the webui — each with its own timer
     and its own keys; explanations live in the keys' tooltips, not on the
     rows).
     A failed or stale scan reads in the area's header row in amber, and as
     an amber mark on the area's tile and strip chip.
     Emails, messages and finance each put one centered line where their
     cards would be when the area came back with nothing; a failed scan puts
     its own card there instead.
     An email set card is three sections — analysis, the member emails,
     actions — each built from one row template with an expandable detail.
     An open email row reads the email's own text from the service and keeps
     it for the rest of the session.
     Its head carries the chat link and one key: skip all (deny every row
     still open) while the set has work left; hide (the card leaves the page)
     once every row is done; retry (void the set and hand its emails back to
     the next scan) when only failed rows are left. The emails header's
     hide-finished key takes every finished set off the page at once; the
     finance and messages headers have the same key for their filed
     transactions and saved rows, and the messages one sits next to a
     skip-all key that denies every attachment still waiting.
     Everything staged is untrusted content (an agent that read untrusted
     email staged it): every variable value enters the DOM through
     textContent on nodes built with document.createElement; the only
     innerHTML is the static lucide icon markup, never data. -->
<style>
/* One dashboard-family surface: gray page behind white cards (the
   dashboard page's Ayu palette), every block icon in one blue, both area
   headers the same neutral ink like the dashboard page's panel titles.
   Each area's header is a
   chrome-less sticky bar: a dense title row over a faint edge-to-edge
   rule, frosted translucent page color while content slides under it.
   An email set is a card whose
   sections (analysis, source emails, actions) read through icons and
   dashed rules, no labels; rows separate by spacing alone. Finance is one
   ledger card per pick ('from email', 'last', 'random', each under a
   small-caps label with its row count), one row per transaction, no icon
   column: payee over one
   gray meta line (date, account, memo), a plain mono amount, then the
   actions — a chevron key that opens the row's extra area, the category
   dropdown pre-picked with the most likely category, the rule checkbox
   chip (three states: indeterminate until the user sets it on or off),
   the approx chip beside it (anchors the rule on the row's amount, off
   and inert while the rule chip is off or unset), and the two-tap green
   check key at the row's end. The toolbar stays dark in both themes. */

:root {
  color-scheme: light;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: #f2f4f5; --panel: #ffffff; --band: #f2f5f6; --fill2: #e6ebee;
  --card-edge: #e6eaed; --card-shadow: 0 1px 3px rgba(16,24,40,.06);
  --ink: #3e4347; --sub: #7d8590; --faint: #a9aeb2;
  --hair: #eef1f2; --rule: #e4e9eb; --track: #d9dfe4;
  --amber: #b06f2f; --green: #5f9147; --tool: #4f7fa3;
  --brand: #ff9a00; --s1: #7aa159; --s2: #9784b6; --s3: #6690b3;
  --dot-sat: 0.8; --dot-lit: 0.85;
  --bar: #292f3c; --bar-ink: #e7eaee; --bar-sub: #9aa4b5;
  --bar-rule: #3b4454; --bar-fill: #333b48; --bar-edge: #20252f;
  --pad-x: 8px;
  --bar-max: 980px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #20252f; --panel: #292f3c; --band: #323949; --fill2: #3b4454;
    --card-edge: #191d27; --card-shadow: 0 1px 3px rgba(0,0,0,.3);
    --ink: #cccac2; --sub: #8894a6; --faint: #5e6879;
    --hair: #323948; --rule: #3b4454; --track: #4a5669;
    --amber: #cf9967; --green: #82a865; --tool: #8ab4cf;
    --brand: #ff9a00; --s1: #85a171; --s2: #a293bd; --s3: #7195b5;
    --dot-sat: 0.65; --dot-lit: 1.0;
    --bar: #171b23; --bar-ink: #cccac2; --bar-sub: #7a8496;
    --bar-rule: #2b323e; --bar-fill: #262c37; --bar-edge: #101318;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #20252f; --panel: #292f3c; --band: #323949; --fill2: #3b4454;
  --card-edge: #191d27; --card-shadow: 0 1px 3px rgba(0,0,0,.3);
  --ink: #cccac2; --sub: #8894a6; --faint: #5e6879;
  --hair: #323948; --rule: #3b4454; --track: #4a5669;
  --amber: #cf9967; --green: #82a865; --tool: #8ab4cf;
  --brand: #ff9a00; --s1: #85a171; --s2: #a293bd; --s3: #7195b5;
  --dot-sat: 0.65; --dot-lit: 1.0;
  --bar: #171b23; --bar-ink: #cccac2; --bar-sub: #7a8496;
  --bar-rule: #2b323e; --bar-fill: #262c37; --bar-edge: #101318;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15px; line-height: 1.6; font-variant-numeric: tabular-nums;
  background: var(--bg); color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  overflow-x: clip;
}
.svg-icon { width: 13px; height: 13px; stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* toolbar: shared component — markup, styles and behavior come from /bar.js
   (app/bar.js, shared with the dashboard page); --bar-max sets its content width */

/* dev design tiles: shared component — markup, styles and behavior come
   from /dev-bar.js (app/dev-bar.js, shared with the dashboard page) */

/* ---- the glance layer: narrow area tiles ---------------------------------
   Narrow enough for 2-3 per row on a phone; the last grid row may wrap.
   Each tile: icon + short name on top, and pinned to the bottom the
   open-items count (only where the area has one) over one shorthand status
   line (amber when something is wrong), so those lines line up across a row
   however far a name wraps. The "queue" tile sits first and
   stacks emails, messages and finance; an area tile shows that area alone. One color per area;
   finance and its report share the green family, the two chat areas the
   blue family. */

.tiles { display: grid; gap: 8px; margin: 14px 0 22px;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.atile { font-family: inherit; font-size: inherit; text-align: left;
  cursor: pointer;
  border: 1px solid var(--card-edge); border-radius: 10px;
  background: var(--panel); box-shadow: var(--card-shadow);
  padding: 8px 11px 6px; color: var(--ink);
  display: flex; flex-direction: column; gap: 1px; min-width: 0; }
/* the icon aligns with the name's first line, so a two-line name does not
   leave it floating halfway down; the 1px nudge keeps a one-line row's
   icon optically centered */
.atile .trow { display: flex; align-items: flex-start; gap: 6px;
  font-size: 12px; font-weight: 650; min-width: 0; }
.atile .trow .svg-icon { width: 14px; height: 14px; stroke-width: 2.2;
  color: var(--ac); flex: none; margin-top: 1px; }
/* a long name ("finance report") wraps to a second line instead of
   clipping; past two lines it still ellipsizes */
.atile .trow .nm { display: -webkit-box; -webkit-box-orient: vertical;
  -webkit-line-clamp: 2; overflow: hidden; line-height: 1.35; }
/* the bottom block — count over status line — pinned to the tile's bottom;
   an area with no count (report, research) leaves the count row out rather
   than holding the space with a placeholder */
.atile .tbot { margin-top: auto; display: flex; flex-direction: column;
  gap: 1px; }
.atile .tcount { font-size: 22px; font-weight: 700; line-height: 1.3; }
.atile .tstat { color: var(--sub); font-size: 10.5px; line-height: 1.5;
  letter-spacing: 0.02em; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; min-height: 16px; }
.atile .tstat .bad { color: var(--amber); }
/* tiles alone show work under way in green; the area headers keep the
   in-flight blue */
.atile .tstat .wrk { color: var(--green); }
/* the prev/next glyphs (history, timer) ride the status line at text size */
.atile .tstat .svg-icon { width: 11px; height: 11px; vertical-align: -2px;
  stroke-width: 2; }
.atile.sel { border: 2px solid var(--ac); padding: 7px 10px 5px; }
.atile.queue { --ac: var(--tool); }
.atile.emails { --ac: var(--brand); }
.atile.finance { --ac: var(--s1); }
.atile.report { --ac: var(--green); }
.atile.research { --ac: var(--tool); }
.atile.messages { --ac: var(--s3); }
.atile.audit { --ac: var(--s2); }
.atile.system { --ac: var(--sub); }

/* the strip: icon+count chips pinned under the bar while the tile grid is
   scrolled out of view, so switching views never needs a scroll back up */
.strip { position: fixed; top: var(--bar-h, 48px); left: 0; right: 0;
  z-index: 35; display: flex; justify-content: center; gap: 6px;
  padding: 7px 1rem; overflow-x: auto;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--rule);
  transform: translateY(-110%); transition: transform .18s; }
.strip.show { transform: none; }
.schip { font-family: inherit; font-size: 12px; font-weight: 650;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  flex: none; min-height: 28px; padding: 2px 11px; border-radius: 14px;
  border: 1px solid var(--rule); background: var(--panel);
  color: var(--sub); }
.schip .svg-icon { width: 13px; height: 13px; stroke-width: 2.2;
  color: var(--ac); }
.schip .n { font-weight: 700; }
.schip .warndot { width: 7px; height: 7px; border-radius: 50%;
  background: var(--amber); }
.schip.on { border-color: var(--ac); color: var(--ink); }
.schip.queue { --ac: var(--tool); }
.schip.emails { --ac: var(--brand); }
.schip.finance { --ac: var(--s1); }
.schip.report { --ac: var(--green); }
.schip.research { --ac: var(--tool); }
.schip.messages { --ac: var(--s3); }
.schip.audit { --ac: var(--s2); }
.schip.system { --ac: var(--sub); }

/* ---- area headers: slim rows, no longer sticky (the strip orients) -------
   A header row is an icon, a name and one status line. It rides the area's
   control row, so the header and the keys are one row; report's header
   stands on its own above its two named rows. */

.area { margin-bottom: 30px;
  /* a strip tap scrolls here; leave room for the bar plus the strip */
  scroll-margin-top: calc(var(--bar-h, 48px) + 46px); }
.area.off { display: none; }
.area-top { display: flex; align-items: baseline; flex-wrap: wrap;
  gap: 8px 12px; margin: 0 2px 12px; padding-bottom: 6px;
  border-bottom: 1px solid var(--rule); }
.area-h { margin: 0; font-size: 13.5px; font-weight: 650;
  letter-spacing: 0; text-transform: capitalize; }
.a-ic { display: grid; place-items: center; align-self: center; flex: none; }
.a-ic .svg-icon { width: 14px; height: 14px; stroke-width: 2.2; }
.a-ic.emails { color: var(--brand); }
.a-ic.finance { color: var(--s1); }
.a-ic.report { color: var(--green); }
.a-ic.research { color: var(--tool); }
.a-ic.messages { color: var(--s3); }
.a-ic.audit { color: var(--s2); }
.a-ic.system { color: var(--sub); }

/* the system console: one row per thing, its own timer and keys per row.
   Every area's control row is built from the same parts, so both read as one
   kind of row. */
.upitem { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px;
  padding: 10px var(--pad-x); }
.upitem + .upitem { border-top: 1px dashed var(--rule); }
.upname { font-weight: 650; font-size: 13.5px; width: 90px; flex: none; }
.upstat { color: var(--sub); font-size: 12.5px; flex: 1; min-width: 150px; }
.upkeys { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap;
  justify-content: flex-end; }

/* a control row carrying the area's header in place of a name: icon, name
   and status line on its left, that area's keys on its right */
.upitem > .area-top { flex: 1 1 auto; min-width: 0;
  margin: 0; padding: 0; border-bottom: 0; }
/* the row holds nothing but this line now, so it wraps rather than cutting
   off: the counts ride its end, and a cut-off count is worth nothing */
.a-info { font-size: 12.5px; letter-spacing: 0.02em; color: var(--sub);
  min-width: 0; }
/* a scan under way reads in the same blue as an in-flight key, so work
   under way is one color across the page */
.a-info .wrk { color: var(--tool); }
.a-info .bad { color: var(--amber); }
/* the second status row, under the heading rule: detail that would push the
   heading row past a phone's width, so it wraps instead of being cut off */
.a-detail { color: var(--sub); font-size: 12.5px; letter-spacing: 0.02em;
  margin: 0 0 12px; }

/* an area with nothing to act on: one centered line where its cards would be */
.empty { display: flex; align-items: center; justify-content: center;
  gap: 8px; color: var(--faint); font-size: 13px;
  padding: 10px var(--pad-x); }
.empty .svg-icon { width: 14px; height: 14px; }

/* ---- set cards ----------------------------------------------------------- */

.wrap { max-width: 980px; margin: 0 auto; padding: 2px 1rem 3rem;
  --pad-x: 18px; }
.panel { margin: 0 0 16px; border: 1px solid var(--card-edge);
  border-radius: 10px; background: var(--panel);
  box-shadow: var(--card-shadow); overflow: hidden; }
.p-head { display: flex; align-items: center; gap: 12px;
  margin: 0; padding: 12px var(--pad-x) 6px;
  cursor: pointer; user-select: none; }
.p-head .t { color: var(--ink); font-size: 15px; font-weight: 650; }
.p-head .fill { flex: 1; }
.p-head .m { min-width: 0; overflow: hidden; text-overflow: ellipsis;
  color: var(--faint); font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; white-space: nowrap; }
.card.closed > :not(.p-head) { display: none; }
.card.closed > .p-head { padding-bottom: 12px; }
.card.done .p-head .t { color: var(--sub); font-weight: 600; }

/* ---- set body: unlabeled sections split by dashed rules ------------------ */

.c-body { padding: 4px 0 10px; display: flex; flex-direction: column; }
.sect { display: flex; flex-direction: column; padding: 6px 0; }
.sect + .sect { border-top: 1px dashed var(--rule); }

/* ---- items --------------------------------------------------------------- */

.blk { padding: 2px 0; }
.b-main { display: flex; align-items: center; gap: 12px;
  padding: 10px var(--pad-x); cursor: pointer; }
@media (hover: hover) {
  .b-main:hover { background: var(--band); }
}
.b-text { flex: 1; min-width: 0; }
.b-title { font-weight: 650; line-height: 1.45;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* a green check after the title marks a row that finished successfully */
.t-done { color: var(--green); margin-left: 6px; }
.t-done .svg-icon { vertical-align: -2px; }
.b-meta { color: var(--sub); font-size: 13.5px; line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.open > .b-main .b-title, .blk.open > .b-main .b-meta { white-space: normal; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical;
  -webkit-line-clamp: 5; overflow: hidden; white-space: normal; }
.blk.open > .b-main .clamp { display: block; -webkit-line-clamp: unset; }
.b-err { color: var(--amber); font-size: 12.5px; line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.open > .b-main .b-err { white-space: normal; }
/* the link line reads as plain text (clickable, but not styled as a link) */
.b-links a { display: block; color: var(--sub); text-decoration: none;
  font-size: 13px; line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.open > .b-main .b-links a { white-space: normal; overflow-wrap: anywhere; }
/* the suggestion note: sparkle + one line saying why this time was proposed */
.b-why { color: var(--sub); font-size: 13px; line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.open > .b-main .b-why { white-space: normal; }
.b-meta .svg-icon, .b-links .svg-icon, .b-why .svg-icon {
  width: 14px; height: 14px;
  vertical-align: -2.5px; margin-right: 5px; color: var(--tool);
  stroke-width: 2.2; }
.b-meta .svg-icon { margin-left: 8px; }
.b-meta .svg-icon:first-child { margin-left: 0; }
.b-side { display: flex; align-items: center; gap: 10px; flex: none;
  font-size: 11.5px; color: var(--faint); }
.caldot { display: inline-block; width: 8px; height: 8px; flex: none;
  border-radius: 50%; margin-right: 4px; vertical-align: 0;
  background: hsl(from var(--cal-raw) h calc(s * var(--dot-sat))
                  calc(l * var(--dot-lit))); }
.blk.settled > .b-main .b-title { color: var(--sub); }
.blk.settled > .b-main .bicon, .blk.settled > .b-main .verb { opacity: .55; }
.blk.gone { opacity: .65; }
.gone-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--faint); border: 1px solid var(--faint);
  border-radius: 4px; padding: 0 4px; }

/* ---- icon column: one blue for every block glyph ------------------------- */

.tilebox { width: 42px; flex: none; display: flex; flex-direction: column;
  align-items: center; gap: 2px; padding: 3px 0;
  align-self: flex-start; }  /* pinned to the block's first text line */
.bicon { position: relative; display: grid; place-items: center;
  width: 26px; height: 26px; color: var(--tool); }
.bicon .svg-icon { width: 20px; height: 20px; stroke-width: 2; }
.verb { font-size: 8.5px; font-weight: 800; letter-spacing: 0.06em;
  text-transform: uppercase; line-height: 1.4; text-align: center;
  color: var(--tool);
  /* a two-line verb ("new suggestion") breaks at its \n and may run a few
     pixels wider than the tilebox — centered, into the 12px column gap */
  white-space: pre-line; width: max-content; }

.stat { flex: none; font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); }
.stat.bad { color: var(--amber); }
.stat.wrk { color: var(--tool); }

/* ---- approve/deny: soft tint chips --------------------------------------- */

.sqs { display: flex; gap: 8px; flex: none; }
.sq { display: grid; place-items: center; width: 46px; height: 40px;
  border-radius: 12px; border: 2px solid transparent; background: var(--band);
  color: var(--sub); cursor: pointer; padding: 0; }
/* a tinted border marks a pressable chip: it only shows while enabled */
.sq .svg-icon { width: 17px; height: 17px; stroke-width: 2.6; }
.sq.yes { background: color-mix(in srgb, var(--green) 13%, var(--bg));
  color: var(--green); }
.sq.yes:not(:disabled) {
  border-color: color-mix(in srgb, var(--green) 40%, var(--bg)); }
.sq.non { background: color-mix(in srgb, var(--amber) 12%, var(--bg));
  color: var(--amber); }
.sq.non:not(:disabled) {
  border-color: color-mix(in srgb, var(--amber) 40%, var(--bg)); }
.sq:disabled { opacity: .4; cursor: default; }
@media (hover: hover) {
  .sq.yes:enabled:hover:not(.armed) {
    background: color-mix(in srgb, var(--green) 22%, var(--bg)); }

/* ---- formatting ---------------------------------------------------------- */

const DAY_FMT = { weekday: "short", month: "short", day: "numeric" };

function ago(ms) {
  const s = Math.round(ms / 1000);
  if (s < 10) return "now";
  if (s < 60) return `${Math.round(s / 10) * 10} sec ago`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} hr ago`;
  const d = Math.round(h / 24);
  return `${d} day${d === 1 ? "" : "s"} ago`;
}

function dur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m ${s % 60}s`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.floor(s / 60) % 60}m`;
  return `${Math.floor(s / 86400)}d ${Math.floor(s / 3600) % 24}h`;
}

function pd(s) {   // "YYYY-MM-DD[ HH:MM]" -> {d: Date, t: "HH:MM"|null}
  const [ds, ts] = s.split(" ");
  const [y, m, d] = ds.split("-").map(Number);
  return { d: new Date(y, m - 1, d), t: ts || null };
}
function fmtDay(s) { return pd(s).d.toLocaleDateString("en-US", DAY_FMT); }
function fmtWhen(start, end) {
  const a = pd(start);
  let out = fmtDay(start) + (a.t ? " · " + a.t : "");
  if (end) {
    const b = pd(end);
    if (start.slice(0, 10) === end.slice(0, 10) && b.t) out += "–" + b.t;
    else out += " → " + fmtDay(end) + (b.t ? " " + b.t : "");
  }
  return out;
}
function repeatText(a) {
  const n = a.repeat_interval || 1;
  const unit = { daily: "day", weekly: "week", monthly: "month", yearly: "year" }[a.repeat];
  let t = n > 1 ? `every ${n} ${unit}s` : a.repeat;
  if (a.repeat_until) t += " until " + fmtDay(a.repeat_until);
  return t;
}
function fromName(f) {
  const m = f.match(/^"?([^"<]+?)"?\s*</);
  return m ? m[1] : f;
}
function fromAddr(f) {
  const m = f.match(/<([^>]+)>/);
  return (m ? m[1] : f).toLowerCase();
}
/* email receivedAt stamps are UTC truncated to the minute ("2026-08-10T20:13")
   — bare, so new Date() would read them as LOCAL time and shift every shown
   time by the UTC offset. Re-attach the zone; zoned stamps pass through. */
function utcDate(iso) {
  return new Date(iso.length === 16 ? iso + ":00Z" : iso);
}
function shortDate(iso) {
  return utcDate(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function shortTime(iso) {
  return utcDate(iso).toLocaleTimeString("en-US",
    { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
}
function fullDate(iso) {
  const d = utcDate(iso);
  return d.toLocaleDateString("en-US", { ...DAY_FMT, year: "numeric" }) + " · "
    + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
}
/* which occurrences a selector row touches, spelled out with dates. A
   span=future row uses the row's series data (repeat pattern, end,
   occurrence count) when the server provides it. */
function occText(a, series) {
  if (a.span !== "future") return fmtWhen(a.start_local) + " · this occurrence only";
  if (series && series.repeat_until) {
    return fmtWhen(a.start_local)
      + ` and all repeats (ends ${fmtDay(series.repeat_until)})`;
  }
  return fmtWhen(a.start_local) + " and all later occurrences";
}
/* the same target as meta segments: [icon name, text] pairs */
function occSegs(a, series) {
  if (a.span !== "future") {
    return [["calendar", fmtWhen(a.start_local) + " · this occurrence only"]];
  }
  return [["calendar", fmtWhen(a.start_local)],
          ["repeat", series && series.repeat_until
            ? `all repeats (ends ${fmtDay(series.repeat_until)})`
            : "all later occurrences"]];
}
/* occurrence count of a create_event's own repeat rule, first one included.
   Monthly/yearly series keep the start's day-of-month and skip months that
   lack it (EventKit semantics), so each occurrence is computed from the
   start — stepping a rolled-over date (Jan 31 + 1 month = Mar 3) would
   drift and overcount */
function countOccurrences(a) {
  if (!a.repeat || !a.repeat_until) return null;
  const interval = a.repeat_interval || 1;
  const start = pd(a.start).d;
  const until = pd(a.repeat_until).d;
  let n = 0;
  if (a.repeat === "daily" || a.repeat === "weekly") {
    const step = (a.repeat === "daily" ? 1 : 7) * interval;
    for (let d = start; d <= until && n < 999;
         d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + step)) n++;
    return n;
  }
  const months = (a.repeat === "monthly" ? 1 : 12) * interval;
  for (let i = 0; n < 999; i += months) {
    const d = new Date(start.getFullYear(), start.getMonth() + i, start.getDate());
    if (d.getDate() !== start.getDate()) continue;  /* month lacks this day — skipped */
    if (d > until) break;
    n++;
  }
  return n;
}
/* the service-recorded snapshot: the event's fields at save time. The
   precheck compares all four exactly (empty stays empty); the list shows
   the non-empty ones. */
function snapshotLines(snap) {
  const out = [];
  if (!snap) return out;
  if (snap.notes) out.push(`notes still read “${snap.notes}”`);
  if (snap.location) out.push(`location is still “${snap.location}”`);
  if (snap.end) out.push("still ends " + fmtWhen(snap.end));
  if (snap.repeats) out.push(`repeat still reads “${snap.repeats}”`);
  if (!out.length) out.push("the event is unchanged since it was proposed");
  return out;
}

   segment is ignored — the email opens wherever it lives, also after

function webmailUrl(m) {

const URL_RE = /https?:\/\/[^\s"'<>]+|(?:[a-z0-9-]+\.)+[a-z]{2,}\/[^\s"'<>()]+/gi;

/* ---- per-kind item content ----------------------------------------------- */
/* Each builder turns a row into the collapsed title + meta and the expanded

   targeted series' repeat pattern, end and occurrence count) when the server

const KINDS = {
  create_event: { mcp: "cal", icon: "calendar", verb: "new" },
  update_event: { mcp: "cal", icon: "calendar", verb: "update" },
  delete_event: { mcp: "cal", icon: "calendar", verb: "delete" },
  archive_email: { mcp: "mail", icon: "mail", verb: "archive" },
  mirror_kick: { mcp: "cal", icon: "calendar", verb: "mirror" },
  open_email: { mcp: "mail", icon: "mail-open", verb: "open" },
  categorize_transaction: { mcp: "fin", icon: "tag", verb: "categorize" },
};

const UPDATE_NAMES = { new_title: "title", start: "start", end: "end",
                       location: "location", notes: "notes" };

/* per-calendar Apple Calendar colors from the emails area; absent -> no dots */
function calDot(cal) {
  const color = ((DATA && DATA.emails.calendar_colors) || {})[cal];
  if (!color) return null;
  const d = el("span", "caldot");
  d.style.setProperty("--cal-raw", color);
  return d;
}

const BUILD = {
  create_event(a) {
    const fields = [["when", fmtWhen(a.start, a.end)]];
    if (a.repeat) {
      const n = countOccurrences(a);
      fields.push(["repeats", repeatText(a)
        + (n ? ` · ${n} occurrences total` : "")]);
    }
    if (a.location) fields.push(["location", a.location]);
    if (a.tz) fields.push(["timezone", a.tz]);
    if (a.notes) fields.push(["notes", a.notes, true]);
    return {
      title: a.title,
      meta: [["calendar", fmtWhen(a.start, a.end)]]
        .concat(a.repeat ? [["repeat", repeatText(a)]] : []),
      links: urlsIn(a.location, a.notes),
      fields,
    };
  },
  update_event(a, r) {
    const ser = r && r.series;
    const changed = Object.keys(UPDATE_NAMES).filter((k) => k in a);
    const fields = [["target", occText(a, ser)]];
    if (ser && ser.repeat_until) {
      fields.push(["repeats", `${ser.repeat} until ${fmtDay(ser.repeat_until)}`
        + (ser.occurrences ? ` · ${ser.occurrences} occurrences total` : "")]);
    }
    if (a.new_title) fields.push(["new title", a.new_title]);
    if (a.start) fields.push(["new start", fmtWhen(a.start)]);
    if (a.end) fields.push(["new end", fmtWhen(a.end)]);
    if (a.location) fields.push(["new location", a.location]);
    if (a.notes) fields.push(["new notes", a.notes, true]);

    if (chk.length) fields.push(["runs only if", chk, true]);
    const segs = [["calendar", fmtWhen(a.start_local) + " → "
      + (a.start ? fmtWhen(a.start, a.end)
                 : "changes " + changed.map((k) => UPDATE_NAMES[k]).join(", "))]];
    if (a.span === "future") {
      segs.push(["repeat", ser && ser.repeat_until
        ? `all repeats (ends ${fmtDay(ser.repeat_until)})`
        : "all later occurrences"]);
    }
    return {
      title: a.title,
      meta: segs,
      links: urlsIn(a.location, a.notes),
      fields,
    };
  },
  delete_event(a, r) {
    const ser = r && r.series;
    const fields = [["target", occText(a, ser)]];
    if (ser && ser.repeat_until) {
      fields.push(["repeats", `${ser.repeat} until ${fmtDay(ser.repeat_until)}`
        + (ser.occurrences ? ` · ${ser.occurrences} occurrences total` : "")]);
    }
    const chk = snapshotLines(a.snapshot);
    if (chk.length) fields.push(["runs only if", chk, true]);
    return {
      title: a.title,
      meta: occSegs(a, ser),
      fields,

  archive_email(a) {
    const emails = a.emails || [];
    const addrs = [...new Set(emails.map((m) => fromAddr(m.from)))];
    // prefer a real display name; some froms are the bare address
    const name = emails.map((m) => fromName(m.from)).find((n) => !n.includes("@"))

    const stamps = emails.map((m) => m.receivedAt).sort();
    const first = shortDate(stamps[0]);
    const last = shortDate(stamps[stamps.length - 1]);
    const range = first === last ? first : first + " – " + last;
    return {
      title: one ? emails[0].subject
        : emails.length + " emails" + (addrs.length === 1 ? " from " + name : ""),
      meta: [[null, addrs.length === 1 ? name : addrs.length + " senders"]],
      when: [["calendar", range]],
      fields: [],   // the expanded state lists the emails as email rows

  open_email(a, r) {

    // title; the detail shows the email itself as a full row

      title: (r && r.label) || "Open the email",
      meta: [[null, fromName(m.from)]],
      when: [["calendar", shortDate(m.receivedAt)],

      fields: [],

    // the ask store, so they are facts, not the agent's wording
    const t = a.transaction;
    const meta = [[null, [pd(t.date).d.toLocaleDateString("en-US",
                     { month: "short", day: "numeric" }), t.account, t.notes]
                   .filter(Boolean).join(" · ")],
                  ["tag", a.category]];
    if (a.update_rule) meta.push([null, " · teaches the payee rule"]);
    return {
      title: t.payee || "(no payee)",
      meta,
      amount: t.amount,
      fields: [],
    };
  },
  mirror_kick(a) {
    // calendar names + dots live in the description line, not the title
    const m = el("span");
    const d1 = calDot("Personal");
    if (d1) m.append(d1);
    m.append("Personal to ");
    const d2 = calDot("Family");
    if (d2) m.append(d2);
    m.append(`Family · refresh the next ${a.days} days`);
    return {
      title: "sync busy state",
      meta: m,
      fields: [["window", `next ${a.days} days`]],
    };
  },
};

/* ---- fetch loop ---------------------------------------------------------- */

let DATA = null, checkedAt = null, failed = false, pageError = "";

/* the cards on screen, as the JSON they were built from — every rebuild
   goes through renderEmails(), so the poll can compare and skip a no-op
   rebuild */
let renderedEmails = null;

/* one row executes at a time in the emails area (the server 409s a second
   approve): while any row is in_progress the other approve keys disable
   and the poll speeds up, so the next key re-enables within seconds */
const anyWorking = () =>
  !!(DATA && DATA.emails.sets.some((s) => s.rows.some((r) => r.status === "in_progress")));

/* a scan run adds sets and moves the decided count for minutes, so the page
   follows it at the same fast pace instead of waiting out the base poll */
const scanning = () => !!(DATA && DATA.emails.job_running_since);

/* rescan feedback: hermes' ledger takes seconds to show the claim, so a
   page-started scan says "starting scan" until a poll sees the run (30 s
   cap in case it never starts) */
let scanStartingAt = 0;

/* a retried set leaves the page at once, but its emails only come back with
   the next scan — the heading carries that reminder until one runs */
let retriedAt = 0;

/* the finance area's own single-flight and scan state, same roles as the
   emails pair above */
const finWorking = () =>
  !!(DATA && DATA.finance.cards.some((c) => c.status === "in_progress"));
const finScanning = () => !!(DATA && DATA.finance.job_running_since);
let finScanStartingAt = 0;

/* the audit's own pair: the run holds a lock for as long as it lasts, and the
   starting window covers the seconds between the tap and the child taking it */
const auditRunning = () => !!(DATA && DATA.hermes_audit.running);
let auditStartingAt = 0;
const auditStarting = () => Date.now() - auditStartingAt < 30000;
/* stamp of the last reset that landed: the header line reads "reset
   successful" for a few seconds after it, then falls back to the run state */
let auditResetAt = 0;

let fastPoll = null;
function pacePoll() {
  clearTimeout(fastPoll);
  fastPoll = null;
  if (anyWorking() || scanning() || finWorking() || finScanning()
      || msgWorking() || msgScanning()
      || Date.now() - scanStartingAt < 30000
      || Date.now() - msgScanStartingAt < 30000
      || Date.now() - finScanStartingAt < 30000 || auditStarting()
      || repBuilding() || Date.now() - repStartingAt < 30000) {
    fastPoll = setTimeout(poll, 3000);
    return;
  }
  /* an audit pass runs for up to an hour and moves a step every few minutes,
     so it polls slower than a scan: three seconds for an hour would be
     thousands of homeserver syncs and budget reads for a line that barely
     moves */
  if (auditRunning()) fastPoll = setTimeout(poll, 10000);
}

function jobLine() {
  if (!DATA) return;
  const em = DATA.emails;
  const jobAt = em.job_last_run_at ? Date.parse(em.job_last_run_at) : null;
  const lastRan = `last ran ${jobAt ? ago(Date.now() - jobAt) : "never"}`;
  /* "scanning" comes from hermes' executions ledger via the server, so
     scheduled runs show it too, not only ones started from this page */
  const since = em.job_running_since ? Date.parse(em.job_running_since) : null;
  if (!since) {
    if (Date.now() - scanStartingAt < 30000) {
      $("#job-line").replaceChildren(el("span", "wrk", "starting scan…"));
      return;
    }
    /* staleness reads in the heading row, in the same place and amber as the
       other areas: the failed marker first, and when the last scan did not
       fail but is older than 11 h, its own marker — the "last ran" stamp
       next to it belongs to the cron job, not to the scan, so it can be
       recent while no batch has landed in days */
    const parts = [];
    const scannedAt = em.last_scan_at ? Date.parse(em.last_scan_at) : null;
    /* a retried set is gone from the page, but its emails stay unproposed
       until a scan takes them — the reminder stands until one lands */
    if (retriedAt && (!scannedAt || scannedAt < retriedAt)) {
      $("#job-line").replaceChildren(
        el("span", "bad", "set retried — run rescan to propose its emails again"),
        `, ${lastRan}`);
      return;
    }
    if (em.last_scan_status === "failed")
      parts.push(el("span", "bad", "last scan failed"), ", ");
    /* 11 h = three missed scans at the every-3-hours cadence, plus 2 h
       slack so one late run does not trip it */
    else if (!scannedAt || Date.now() - scannedAt > 11 * 3600 * 1000)
      parts.push(el("span", "bad", "no scan in over 11 hr"), ", ");
    parts.push(lastRan);
    $("#job-line").replaceChildren(...parts);
    return;
  }
  scanStartingAt = 0;
  /* the decided count belongs to this run only once its own scan has
     handed the batch over — an older stamp means an older run's batch */
  const scanAt = em.last_scan_at ? Date.parse(em.last_scan_at) : null;
  const decided = scanAt && scanAt >= since && em.batch_total
    ? `, ${em.batch_decided}/${em.batch_total} decided` : "";
  $("#job-line").replaceChildren(
    el("span", "wrk", `scanning (${dur(Date.now() - since)})${decided}`),
    `, ${lastRan}`);
}

/* the finance heading row's scan status: last-run time, a running indicator
   with elapsed time, and a failed marker when the last run failed — the
   stamps cover finance-daily and finance-uncategorized together */
function finJobLine() {
  if (!DATA) return;
  const fin = DATA.finance;
  const jobAt = fin.job_last_run_at ? Date.parse(fin.job_last_run_at) : null;
  const lastRan = `last ran ${jobAt ? ago(Date.now() - jobAt) : "never"}`;
  const since = fin.job_running_since ? Date.parse(fin.job_running_since) : null;
  if (since) {
    finScanStartingAt = 0;
    $("#fin-job-line").replaceChildren(
      el("span", "wrk", `scanning (${dur(Date.now() - since)})`), `, ${lastRan}`);
    return;
  }
  if (Date.now() - finScanStartingAt < 30000) {
    $("#fin-job-line").replaceChildren(el("span", "wrk", "starting scan…"));
    return;
  }
  const parts = [];
  if (fin.job_last_failed) parts.push(el("span", "bad", "last run failed"), ", ");
  parts.push(lastRan);
  $("#fin-job-line").replaceChildren(...parts);
}

/* the hermes-audit heading row: where the run is now, or when the last pass
   landed, plus the detail row under the heading rule. The audit's stamps are
   local wall-clock ISO without a zone (they come from datetime.now()), so
   they parse as local time, not UTC. */
function auditLine() {
  if (!DATA) return;
  const a = DATA.hermes_audit;
  const line = $("#aud-line");
  const detail = $("#aud-detail");
  detail.hidden = true;   /* only a run in flight fills it */
  const run = a.run;
  /* a reset that just landed reads "reset successful" in the same blue as
     work under way — the reset leaves no run behind, so without this the
     line would drop straight to "no run recorded yet" */
  if (Date.now() - auditResetAt < 10000) {
    line.replaceChildren(el("span", "wrk", "reset successful"));
    return;
  }
  if (a.running && run) {
    const since = run.started_at ? Date.parse(run.started_at) : null;
    /* categories that have come back, never the step ordinal: the run works
       in its own order (the github watch goes first, because it feeds later
       gates), so a step number would disagree with the card numbers, which
       are the report's order */
    const done = (run.categories || []).filter(
      (c) => c.state === "ok" || c.state === "warn").length;
    line.replaceChildren(el("span", "wrk",
      `running${since ? ` (${dur(Date.now() - since)})` : ""}`
      + `, ${done} of ${run.total} done`));
    /* the category and the LLM call share the row under the heading rule:
       on the heading itself they are wider than a phone, and that row cuts
       off what does not fit. One LLM call can hold a category for an hour,
       so a step that has not moved is normal — naming the call in flight is
       what tells a slow model from a hung one. */
    let text = `Progress: ${run.category}`;
    if (run.llm) {
      const at = run.llm_started ? Date.parse(run.llm_started) : null;
      text += ` · LLM call: ${run.llm}`
        + (at ? ` (${dur(Date.now() - at)})` : "");
    }
    detail.textContent = text;
    detail.hidden = false;
    return;
  }
  if (a.running || auditStarting()) {
    line.replaceChildren(el("span", "wrk", "starting run…"));
    return;
  }
  if (!run) {
    line.replaceChildren(a.error
      ? el("span", "bad", "last run could not start")
      : document.createTextNode("no run recorded yet"));
    return;
  }
  if (!run.finished_at) {
    line.replaceChildren(el("span", "bad", "last run ended without a report"));
    return;
  }
  /* a finished pass with newer stderr means the last start never got as far
     as its own record, so the cards below belong to the pass before it */
  if (a.error) {
    line.replaceChildren(el("span", "bad", "last run could not start"),
      `, pass below from ${ago(Date.now() - Date.parse(run.finished_at))}`);
    return;
  }
  /* a scheduled run that died before audit.py wrote anything leaves no trace
     in the record or the stderr file — only the cron job's own stamps know */
  if (a.job_last_failed && a.job_last_run_at
      && Date.parse(a.job_last_run_at) > Date.parse(run.finished_at)) {
    line.replaceChildren(el("span", "bad", "last run failed"),
      `, pass below from ${ago(Date.now() - Date.parse(run.finished_at))}`);
    return;
  }
  line.textContent = "last ran " + ago(Date.now() - Date.parse(run.finished_at));
}

/* how long each restartable process has been up, one console row each: the
   audit's staleness finding is about a process older than the plugin
   deploy, so the age is what says whether a restart landed. Redrawn by
   tick() too, so it grows between polls. */
function sysLine() {
  if (!DATA) return;
  for (const name of ["gateway", "webui"]) {
    const at = DATA.system[name];
    $("#sys-" + name + "-line").textContent =
      at ? `started ${ago(Date.now() - Date.parse(at))}` : "not running";
  }
}

function tick() {
  const stamp = $("#stamp");
  stamp.classList.toggle("bad", failed || !!pageError);
  stamp.textContent = checkedAt ? "updated " + ago(Date.now() - checkedAt)
                                : "connecting…";
  const strip = $("#page-error");
  strip.textContent = pageError;
  strip.hidden = !pageError;
  /* the wordmark's status text: OFFLINE when polls fail, WARN while the
     iris-status thread reports issues (or the check itself failed) — empty
     until the first poll */
  if (checkedAt) {
    const n = DATA && DATA.status_issues;
    barStatus(failed ? "off" : pageError || n ? "warn" : "ok",
      n > 0 ? `${n} issue${n === 1 ? "" : "s"} — see the dashboard`
            : n === -1 ? "status check failed" : "");
  }
  if (pageError) return;  /* the meta lines read DATA and may be what broke */
  jobLine();  /* the scan timers move between polls */
  finJobLine();
  repLine();
  resLine();
  /* a research row's "started" note expires ten seconds after the tap */
  if (resStarted.size) renderResearch();
  msgJobLine();
  auditLine();
  sysLine();
  renderTiles();  /* the tiles' shorthand ages move between polls too */
}

function renderMeta() {
  jobLine();
  finJobLine();
  repLine();
  resLine();
  msgJobLine();
  auditLine();
  sysLine();
  /* the counts ride the end of each area's scan line, in their shortest
     form. 0 emails means "no provably-complete inbox listing yet", so that
     count drops out */
  const inbox = DATA.emails.inbox_count;
  $("#emails-count").textContent = inbox ? `, ${inbox} in inbox` : "";
  const fc = $("#fin-count");
  const fbits = [];
  /* hidden duplicates: cards not rendered because an email card holds their
     transaction — counted here so a short scan group reads as deduped, not
     missing */
  const dups = DATA.finance.cards.length - finVisibleCards().length;
  if (dups) fbits.push(`${dups} duplicate${dups === 1 ? "" : "s"}`);
  /* open categorize asks: the questions are mailed, the reply still out —
     counted so an ask never expires in silence (14 days, then the scan
     prunes it). Who each went to and when is in the line's tooltip */
  const asks = DATA.finance.open_asks || [];
  if (asks.length) fbits.push(`${asks.length} ask${asks.length === 1 ? "" : "s"} out`);
  fc.textContent = fbits.length ? ", " + fbits.join(", ") : "";
  if (asks.length)
    fc.title = asks.map((a) =>
      `categorize ask out to ${a.to_addr} — ${a.items} item${a.items === 1 ? "" : "s"}, sent ${fmtDay(a.created_at.slice(0, 10))}`
    ).join("\n");
  else fc.removeAttribute("title");
  /* hide finished: takes every finished set off the page at once, so it is
     out while no card is finished */
  const doneSets = DATA.emails.sets.filter(isResolved).length;
  const clear = $("#emails-hide");
  clear.disabled = !doneSets || armedButtonBusy("emails-hide-finished");
  clear.title = doneSets
    ? `take ${doneSets} finished set${doneSets === 1 ? "" : "s"} off the page`
    : "no finished set on the page";
  /* hide finished: takes every filed transaction off the page at once, out
     while none is filed */
  const doneFin = DATA.finance.cards.filter(finSettled).length;
  const finHide = $("#fin-hide");
  finHide.disabled = !doneFin || armedButtonBusy("fin-hide-finished");
  finHide.title = doneFin
    ? `take ${doneFin} filed transaction${doneFin === 1 ? "" : "s"} off the page`
    : "no filed transaction on the page";
  /* hide finished: takes every saved message row off the page at once, out
     while no row is saved */
  const doneMsgs = DATA.messages.cards.filter(
    (c) => c.status === "success").length;
  const msgHide = $("#msg-hide");
  msgHide.disabled = !doneMsgs || armedButtonBusy("messages-hide-finished");
  msgHide.title = doneMsgs
    ? `take ${doneMsgs} saved row${doneMsgs === 1 ? "" : "s"} off the page`
    : "no saved row on the page";
  /* skip all: denies every message card still waiting — a denied attachment
     never comes back, so the key says so */
  const openMsgs = DATA.messages.cards.filter(
    (c) => c.status === "pending" || c.status === "run_failed").length;
  const msgSkip = $("#msg-skip");
  msgSkip.disabled = !openMsgs || msgWorking()
    || armedButtonBusy("messages-skip-all");
  msgSkip.title = openMsgs
    ? `deny ${openMsgs} attachment${openMsgs === 1 ? "" : "s"} — none comes back`
    : "no attachment is waiting for a decision";
  /* the starting window keeps the key grey between the firing tap and the
     first poll that sees the run in hermes' ledger */
  $("#rescan").disabled = scanning() || Date.now() - scanStartingAt < 30000;
  $("#fin-rescan").disabled = finScanning() || Date.now() - finScanStartingAt < 30000;
  $("#msg-rescan").disabled = msgScanning() || Date.now() - msgScanStartingAt < 30000;
  $("#rep-build").disabled = repBuilding() || Date.now() - repStartingAt < 30000;
  /* one run at a time: run and reset are out while a run holds the lock,
     stop only exists while one does (reset would be refused by audit.py
     anyway — the key is grey so the tap never has to fail) */
  const busy = auditRunning() || auditStarting();
  $("#aud-run").disabled = busy;
  $("#aud-reset").disabled = busy;
  $("#aud-stop").disabled = !auditRunning();
  syncSubmitAll();
}

/* ---- glance tiles + view -------------------------------------------------- */
/* One tile per area, led by the queue tile: the count of open items, one
   shorthand status line, amber when the area's scan failed or a process is
   down. A tile picks the view — the queue tile stacks emails, messages and
   finance, an area tile shows it alone — and the choice sticks in
   localStorage, per device and per
   origin, like the bar's prefs. The strip mirrors the tiles as icon+count
   chips pinned under the bar while the grid is scrolled out of view.
   Counts: emails/finance/messages count the rows waiting for a decision,
   audit the findings left. The queue tile counts emails + messages +
   finance only. */

localStorage.removeItem("iris-areas-collapsed");   /* the old collapse UI's store */
const VIEW_KEY = "iris-actions-view";
const AREA_IDS = ["emails", "messages", "finance", "report", "research",
                  "audit", "system"];
/* the areas the queue view stacks, its tile sums and its icons name */
const QUEUE_IDS = ["emails", "messages", "finance"];
let view = localStorage.getItem(VIEW_KEY);
if (view !== "queue" && !AREA_IDS.includes(view)) view = "queue";

/* "2.1 hr" / "3 d" — the tiles' short form of ago() */
function shortAgo(ms) {
  const m = Math.round(ms / 60000);
  if (m < 60) return `${Math.max(m, 0)} min`;
  const h = Math.round(m / 6) / 10;
  if (h < 24) return `${h.toFixed(1)} hr`;
  return `${Math.round(h / 24)} d`;
}

/* "45m" / "2.1h" / "3d" — the prev/next stamps' compact span form */
function tinyDur(ms) {
  const m = Math.max(Math.round(Math.abs(ms) / 60000), 0);
  if (m < 60) return `${m}m`;
  const h = Math.round(m / 6) / 10;
  if (h < 24) return `${h.toFixed(1)}h`;
  return `${Math.round(h / 24)}d`;
}

/* the last run's age behind a check glyph (done), the time to the
   scheduled run behind an hourglass (waiting); a missing stamp drops its
   half. Returns a fragment — the tile status line takes nodes as well as
   strings. */
function prevNext(prevAt, nextAt) {
  const f = document.createDocumentFragment();
  if (prevAt)
    f.append(icon("check"), " " + tinyDur(Date.now() - Date.parse(prevAt)));
  if (prevAt && nextAt) f.append(" · ");
  if (nextAt)
    f.append(icon("hourglass"), " " + tinyDur(Date.parse(nextAt) - Date.now()));
  return f;
}

/* per-area tile facts: name, icon, open count (null = no count), shorthand
   status segments [class, text] — "bad" also marks the tile and its strip
   chip amber. The scanned areas' shorthand is the prev/next run stamps;
   the rest mirrors what the area's own header line says. */
const TILES = {
  emails: {
    name: "emails", icon: "mail",
    count: () => DATA.emails.sets.reduce(
      (n, s) => n + s.rows.filter((r) => r.status === "pending").length, 0),
    short() {
      const em = DATA.emails;
      if (em.job_running_since) return [["wrk", "scanning"]];
      if (em.last_scan_status === "failed") return [["bad", "scan failed"]];
      const at = em.last_scan_at ? Date.parse(em.last_scan_at) : null;
      if (!at) return [["bad", "no scan"]];
      return [[Date.now() - at > 11 * 3600 * 1000 ? "bad" : "",
        prevNext(em.last_scan_at, em.job_next_run_at)]];
    },
  },
  finance: {
    name: "finance", icon: "dollar-sign",
    count: () => finVisibleCards()
      .filter((c) => c.status === "pending").length,
    short() {
      const fin = DATA.finance;
      if (fin.job_running_since) return [["wrk", "scanning"]];
      if (fin.job_last_failed) return [["bad", "scan failed"]];
      const f = prevNext(fin.job_last_run_at, fin.job_next_run_at);
      return f.hasChildNodes() ? [["", f]] : [];
    },
  },
  report: {
    name: "finance report", icon: "file-chart",
    count: () => null,
    short() {
      const fr = DATA.finance_report;
      if (fr.building_since) return [["wrk", "building"]];
      /* the newest cached part stands for the area; no build yet says
         nothing — an empty line instead of a "no preview" placeholder */
      const reps = Object.values(fr.reports);
      if (!reps.length) return [];
      const last = reps.reduce((a, b) =>
        Date.parse(a.built_at) >= Date.parse(b.built_at) ? a : b);
      if (last.error) return [["bad", "build failed"]];
      return [["", "built "
        + shortAgo(Date.now() - Date.parse(last.built_at))]];
    },
  },
  research: {
    name: "research", icon: "telescope",
    count: () => null,
    short() {
      const r = DATA.research;
      if (!r.topics.length) return [["", "no topics"]];
      if (r.topics.some((x) => x.running)) return [["wrk", "running"]];
      const fails = r.topics.filter((x) => x.failing).length;
      if (fails) return [["bad", `${fails} failing`]];
      /* the newest successful run over all topics, then the batch */
      const last = r.topics.map((x) => x.last_run).filter(Boolean).sort().pop();
      const pn = prevNext(last, r.next_batch);
      if (pn.hasChildNodes()) return [["", pn]];
      return [["", `${r.topics.length} topic${r.topics.length === 1 ? "" : "s"}`]];
    },
  },
  messages: {
    name: "messages", icon: "message-square",
    count: () => DATA.messages.cards.filter(
      (c) => c.status === "pending" || c.status === "run_failed").length,
    short() {
      const m = DATA.messages;
      if (m.job_running_since) return [["wrk", "scanning"]];
      if (m.job_last_failed || (m.last_scan_status && m.last_scan_status !== "ok"))
        return [["bad", "scan failed"]];
      if (!m.job_last_run_at) return [["", "no scan yet"]];
      return [["", prevNext(m.job_last_run_at, m.job_next_run_at)]];
    },
  },
  audit: {
    name: "audit", icon: "clipboard-check",
    count: () => ((DATA.hermes_audit.run || {}).categories || [])
      .filter((c) => c.state === "warn")
      .reduce((n, c) => n + c.findings.length, 0),
    short() {
      const a = DATA.hermes_audit;
      if (a.running) return [["wrk", "running"]];
      if (!a.run) return a.error ? [["bad", "failed"]] : [["", "no run yet"]];
      if (!a.run.finished_at) return [["bad", "no report"]];
      if (a.error) return [["bad", "failed"]];
      /* a scheduled run that died before audit.py wrote its record shows only
         in the cron job's own stamps */
      if (a.job_last_failed && a.job_last_run_at
          && Date.parse(a.job_last_run_at) > Date.parse(a.run.finished_at))
        return [["bad", "failed"]];
      return [["", prevNext(a.run.finished_at, a.job_next_run_at)]];
    },
  },
  system: {
    name: "system", icon: "server",
    count: () => null,
    short() {
      const down = ["gateway", "webui"].filter((n) => !DATA.system[n]);
      if (down.length) return [["bad", down.join(" + ") + " down"]];
      return [];
    },
  },
};
const TILE_ICONS = { emails: "mail",
  finance: "dollar-sign", report: "file-chart", research: "telescope",
  messages: "message-square", audit: "clipboard-check", system: "server" };

function renderTiles() {
  if (!DATA) return;
  const counts = {};
  for (const id of AREA_IDS) counts[id] = TILES[id].count();
  const total = QUEUE_IDS.reduce((n, id) => n + (counts[id] || 0), 0);
  const host = $("#tiles");
  host.replaceChildren();
  const mk = (id, name, count, short) => {
    const b = el("button", "atile " + id + (view === id ? " sel" : ""));
    const trow = el("span", "trow");
    if (id === "queue") trow.append(...QUEUE_IDS.map((q) => icon(TILE_ICONS[q])));
    else trow.append(icon(TILE_ICONS[id]), el("span", "nm", name));
    b.append(trow);
    const bot = el("span", "tbot");
    if (count != null) bot.append(el("span", "tcount", String(count)));
    const stat = el("span", "tstat");
    for (const [cls, text] of short) {
      const seg = el("span", cls);
      seg.append(text);   /* a string or a prevNext fragment */
      stat.append(seg);
    }
    bot.append(stat);
    b.append(bot);
    b.addEventListener("click", () => setView(id, false));
    return b;
  };
  host.append(mk("queue", null, total, [["", "queue"]]));
  for (const id of AREA_IDS)
    host.append(mk(id, TILES[id].name, counts[id], TILES[id].short()));
  renderStrip(counts, total);
}

function renderStrip(counts, total) {
  const host = $("#strip");
  host.replaceChildren();
  const mk = (id, count, warn) => {
    const c = el("button", "schip " + id + (view === id ? " on" : ""));
    c.setAttribute("aria-label", id);
    if (id === "queue") c.append(...QUEUE_IDS.map((q) => icon(TILE_ICONS[q])));
    else c.append(icon(TILE_ICONS[id]));
    if (count != null) c.append(el("span", "n", String(count)));
    if (warn) c.append(el("span", "warndot"));
    c.addEventListener("click", () => setView(id, true));
    return c;
  };
  host.append(mk("queue", total, false));
  for (const id of AREA_IDS)
    host.append(mk(id, counts[id],
      TILES[id].short().some(([cls]) => cls === "bad")));
}

/* every area carries its own keys, so a view is which areas show */
function applyView() {
  for (const id of AREA_IDS)
    document.getElementById("area-" + id).classList.toggle("off",
      view === "queue" ? !QUEUE_IDS.includes(id) : view !== id);
}

/* scroll: a strip tap lands the view's first area at the top; a tile tap
   changes nothing about the scroll (the tiles are already on screen) */
function setView(id, scroll) {
  view = id;
  localStorage.setItem(VIEW_KEY, id);
  applyView();
  renderTiles();
  if (scroll)
    document.getElementById("area-" + (id === "queue" ? QUEUE_IDS[0] : id))
      .scrollIntoView({ block: "start" });
}
applyView();

/* the strip shows only while the tile grid is out of view */
new IntersectionObserver(([entry]) =>
  $("#strip").classList.toggle("show", !entry.isIntersecting),
  { rootMargin: "-48px 0px 0px 0px" }).observe($("#tiles"));

async function poll() {
  try {
    const r = await fetch("/api/state");
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json();
    checkedAt = Date.now();
    failed = false;
  } catch {
    failed = true;
    tick();
    return;
  }
  /* a render pass that throws (e.g. the JSON missing an area the page
     expects) must show as an error, never as a page that looks fine
     but stays empty */
  try {
    renderMeta();
    /* a text selection or a focused button must survive the poll: rebuild
       an area only when its cards actually differ from the ones on screen
       (armed and in-flight keys survive rebuilds via armedButton's registry) */
    if (JSON.stringify(DATA.emails.sets) !== renderedEmails) renderEmails();
    if (finSnapshot() !== renderedFinance) renderFinance();
    if (repSnapshot() !== renderedReport) renderReport();
    if (resSnapshot() !== renderedResearch) renderResearch();
    if (msgSnapshot() !== renderedMessages) renderMessages();
    if (auditSnapshot() !== renderedAudit) renderAudit();
    pageError = "";
    pacePoll();
  } catch (e) {
    pageError = "page error: " + e.message;
  }
  tick();
}

/* ---- open/closed state, kept outside DATA so it survives polls ----------- */

const openBlocks = new Set();          // "setid/rowid" keys of expanded items
const cardClosed = new Map();          // set id -> user's toggle choice

const isResolved = (s) => s.state === "resolved";
const isClosed = (s) =>
  cardClosed.has(s.id) ? cardClosed.get(s.id) : isResolved(s);

/* whole rows toggle open/closed — but not when the click lands on a button
   or link, and not when the user just dragged to select text. render is the
   area's own rebuild; the email rows leave it unset */
function toggler(key, render) {
  return (e) => {
    if (e.target.closest("button, a")) return;
    const sel = window.getSelection();
    if (sel && sel.type === "Range") return;
    if (openBlocks.has(key)) openBlocks.delete(key); else openBlocks.add(key);
    (render || renderEmails)();
  };
}

/* ---- item builders ------------------------------------------------------- */

function fieldEl(k, v, wide) {
  const f = el("div", "field" + (wide ? " wide" : ""));
  f.append(el("div", "fk", k));
  (Array.isArray(v) ? v : [v]).forEach((line) => f.append(el("div", "fv", line)));
  return f;
}

/* one .b-meta line: a plain string, a node, {clamp: text}, or a list of
   [icon name | null, text-or-node] segments */
function metaEl(line) {
  if (line.clamp !== undefined) return el("div", "b-meta clamp", line.clamp);
  const m = el("div", "b-meta");
  if (typeof line === "string") m.textContent = line;
  else if (!Array.isArray(line)) m.append(line);
  else line.forEach(([ic, t]) => { if (ic) m.append(icon(ic)); m.append(t); });
  return m;
}

/* the one row every area builds from: a main line — the tile, then the text
   column (title, meta lines, why, links, error), then amount, status and
   keys on the right — plus an optional expandable area. Slots not passed
   are simply absent; every class is one the CSS already knows.
   o: {cls, mainCls, key, onToggle, tile, title, done, meta, why, links, err,
   amount, status, statusTitle, keys, expand}; a key wires the open/close
   toggle through openBlocks, onToggle naming the area's rebuild. */
function rowEl(o) {
  const blk = el("div", o.cls + (o.key && openBlocks.has(o.key) ? " open" : ""));
  const main = el("div", o.mainCls || "b-main");
  if (o.key) main.addEventListener("click", toggler(o.key, o.onToggle));
  if (o.tile) main.append(o.tile);
  const tx = el("div", "b-text");
  if (o.title !== undefined) {
    const t = el("div", "b-title");
    t.append(o.title);
    if (o.done) {
      const ok = el("span", "t-done");
      ok.append(icon("check"));
      t.append(ok);
    }
    tx.append(t);
  }
  (o.meta || []).forEach((line) => tx.append(metaEl(line)));
  if (o.why) {
    const why = el("div", "b-why");
    why.append(icon("sparkle"), o.why);
    tx.append(why);
  }
  if (o.links && o.links.length) {
    const ln = el("div", "b-links");
    o.links.forEach((u) => ln.append(linkEl(u)));
    tx.append(ln);
  }
  if (o.err) tx.append(el("div", "b-err", o.err));
  main.append(tx);
  if (o.amount) main.append(o.amount);
  if (o.status) {
    const st = el("span", "stat" + (o.status[1] ? " " + o.status[1] : ""),
                  o.status[0]);
    if (o.statusTitle) st.title = o.statusTitle;
    main.append(st);
  }
  if (o.keys) main.append(o.keys);
  blk.append(main);
  if (o.expand) blk.append(o.expand);
  return blk;
}

/* the chat chip — the set card's "hand to iris" link and the finance row's
   "discuss" link are the same key */
function chatKey(prompt, title) {
  const chat = el("a", "key chatkey");
  chat.append(icon("message-square"), "chat");
  chat.href = WEBUI + "?prompt=" + encodeURIComponent(prompt);
  chat.target = "_blank";
  chat.rel = "noopener";
  chat.title = title;
  return chat;
}

/* injected mail (an iris:-prefixed id) lives in the iris account — the
   hi@ deep link cannot open it, so those rows show no go link */
const isIris = (id) => id.startsWith("iris:");

/* the panel a failed scan leaves behind — the failure's step in the head,
   its message in the body. Finance and messages both post one */
function scanErrorEl(err) {
  const p = el("section", "panel fin");
  const head = el("div", "p-head");
  head.append(el("span", "t", "last scan failed"), el("span", "fill"),
              el("span", "m", err.step));
  p.append(head);
  const body = el("div", "c-body");
  body.append(el("div", "b-err", err.message));
  p.append(body);
  return p;
}

/* nothing left to act on: the line that stands where an area's cards would
   be. A failed scan puts its own card there instead, so this only shows when
   the area came back with nothing */
function emptyEl(text) {
  const d = el("div", "empty");
  d.append(icon("check"), el("span", null, text));
  return d;
}

/* the mono amount both finance-flavored rows show */
function amtEl(amount) {
  return el("span", "fin-amt" + (Number(amount) > 0 ? " pos" : ""),
            fmtAmount(amount));
}

/* a suggestion note swaps the tile icon, per kind: a suggested time wears
   the calendar-search; a categorize row's suggestion (the answer's own
   wording) keeps the tag */
const SUGGESTION_TILE = { create_event: "calendar-search" };

/* right-side status per row: [word, color class] — one table for the inbox
   action rows and the finance ledger rows */
const STAT = {
  in_progress: ["in progress", "wrk"], success: ["done", ""],
  done: ["done", ""], already_handled: ["already handled", ""],
  denied: ["denied", ""], failed: ["failed", "bad"],
  run_failed: ["run failed", "bad"], precheck_failed: ["precheck failed", "bad"],
  unknown: ["issue", "bad"],
};
const SETTLED = ["success", "denied", "run_failed", "precheck_failed", "unknown"];
const BAD = ["run_failed", "precheck_failed", "unknown"];

/* args as a colorized JSON block: spans only, textContent only */
function jsonEl(v) {
  const pre = el("pre", "json");
  const put = (cls, text) => pre.append(cls ? el("span", cls, text) : text);
  (function walk(v, ind) {
    if (typeof v === "string") put("js", JSON.stringify(v));
    else if (typeof v === "number") put("jn", String(v));
    else if (v === true || v === false || v === null) put("jb", String(v));
    else if (Array.isArray(v)) {
      if (!v.length) { put(null, "[]"); return; }
      put(null, "[\n");
      v.forEach((x, i) => {
        put(null, " ".repeat(ind + 2));
        walk(x, ind + 2);
        put(null, (i < v.length - 1 ? "," : "") + "\n");
      });
      put(null, " ".repeat(ind) + "]");
    } else {
      const ks = Object.keys(v);
      if (!ks.length) { put(null, "{}"); return; }
      put(null, "{\n");
      ks.forEach((k, i) => {
        put(null, " ".repeat(ind + 2));
        put("jk", JSON.stringify(k));
        put(null, ": ");
        walk(v[k], ind + 2);
        put(null, (i < ks.length - 1 ? "," : "") + "\n");
      });
      put(null, " ".repeat(ind) + "}");
    }
  })(v, 0);
  return pre;
}

function analysisEl(s) {
  const by = s.created_by || {};
  const detail = el("div", "b-detail");
  detail.append(el("div", "b-status",
    ["proposed " + fullDate(s.created_at), by.job, by.session]
      .filter(Boolean).join(" · ")));
  return rowEl({ key: s.id + "/analysis", cls: "blk",
                 tile: tileEl("neut", "sparkle"),
                 meta: [{ clamp: s.rationale }], expand: detail });
}

/* the email's own text, read from the service the first time its row opens
   and kept for the rest of the session — a set stores the snapshot facts,
   never the body, and an email's text does not change. Map: email id ->
   {state: loading|ok|error, text} */
const mailBody = new Map();

async function fetchMailBody(setId, emailId) {
  mailBody.set(emailId, { state: "loading" });
  let entry;
  try {
    const q = `set_id=${encodeURIComponent(setId)}`
      + `&email_id=${encodeURIComponent(emailId)}`;
    const res = await fetch("/api/emails/body?" + q);
    const out = await res.json().catch(() => ({}));
    entry = res.ok
      ? { state: "ok", text: out.text || "" }
      : { state: "error", text: out.error || `could not read the email (${res.status})` };
  } catch {
    entry = { state: "error", text: "the service is unreachable" };
  }
  mailBody.set(emailId, entry);
  renderEmails();
}

/* one email row; ctx keeps the open/closed state separate when the same
   email renders in two places (based on + an archive card) */
function emailEl(s, m, ctx) {
  const side = el("div", "b-side");
  if (m.gone) side.append(el("span", "gone-tag", "left inbox"));
  if (!isIris(m.id)) {
    const go = el("a", "golink");
    go.href = webmailUrl(m);
    go.target = "_blank";
    go.rel = "noopener";
    go.title = "open in Webmail";
    go.append(icon("external-link"));
    side.append(go);
  }
  const detail = el("div", "b-detail");
  detail.append(el("div", "b-status", m.from));
  detail.append(el("div", "b-status", "received " + fullDate(m.receivedAt)));
  /* the email's text sits under those two lines; the fetch starts on the
     open, so a closed row costs nothing */
  const key = s.id + "/" + m.id + (ctx ? "/" + ctx : "");
  if (openBlocks.has(key)) {
    const got = mailBody.get(m.id);
    if (got === undefined) fetchMailBody(s.id, m.id);
    if (got && got.state === "ok")
      detail.append(el("pre", "rawtext", got.text));
    else if (got && got.state === "error")
      detail.append(el("div", "b-err", got.text));
    else
      detail.append(el("div", "b-status", "reading the email…"));
  }
  return rowEl({ key,
                 cls: "blk" + (m.gone ? " gone" : ""),
                 tile: tileEl("mail", "mail"),
                 title: fromName(m.from),
                 meta: [m.subject,
                        [["calendar", shortDate(m.receivedAt)],
                         ["clock", shortTime(m.receivedAt)]]],
                 keys: side, expand: detail });
}

function actionEl(s, r) {
  const key = s.id + "/" + r.id;
  const kind = KINDS[r.kind];
  const c = BUILD[r.kind](r.args, r);

  /* the calendar name with its dot leads the first meta line */
  const segs = [];
  const calName = r.args.calendar;
  if (calName) {
    const cal = el("span");
    const dot = calDot(calName);
    if (dot) cal.append(dot);
    cal.append(calName);
    segs.push([null, cal]);
  }
  if (Array.isArray(c.meta)) {   // [icon name | null, text] segments
    segs.push(...c.meta);
  } else {
    if (calName) segs.push([null, " · "]);
    segs.push([null, c.meta]);
  }
  const meta = [segs];
  if (c.when) meta.push(c.when);   // the timestamp on its own line

  /* pending: the approve/deny chips (plus the open_email go link); anything
     else: the status word */
  let keys = null, status = null, statusTitle = "";
  if (r.status === "pending") {
    const yes = el("button", "sq yes");
    yes.append(icon("check"));
    yes.setAttribute("aria-label", r.kind === "open_email" ? "done" : "approve");
    const non = el("button", "sq non");
    non.append(icon("x"));
    non.setAttribute("aria-label", "deny");
    if (anyWorking()) {
      yes.disabled = true;
      yes.title = "another row is working";
    } else {
      armedButton(yes, key + "/yes", () => decide(s, r, "approve"));
    }
    armedButton(non, key + "/non", () => decide(s, r, "deny"));
    const sqs = el("div", "sqs");
    if (r.kind === "open_email" && !isIris(r.args.email.id)) {
      // the row's own action: a plain link to the email in Webmail; the
      // check only marks the row done (a server-side no-op)
      const go = el("a", "sq go");
      go.append(icon("mail-open"));
      go.href = webmailUrl(r.args.email);
      go.target = "_blank";
      go.rel = "noopener";
      go.title = "open in Webmail";
      go.setAttribute("aria-label", "open in Webmail");
      go.addEventListener("click", (e) => e.stopPropagation());
      sqs.append(go);
    }
    sqs.append(yes, non);
    keys = sqs;
  } else if (STAT[r.status]) {
    status = STAT[r.status];
    statusTitle = r.status_text;
  }

  const detail = el("div", "b-detail");
  // the archive and open_email labels repeat the title — skip them there
  if (r.kind !== "archive_email" && r.kind !== "open_email")
    detail.append(el("div", "b-label", r.label));
  const fields = el("div", "fields");
  c.fields.forEach(([k, v, wide]) => fields.append(fieldEl(k, v, wide)));
  if (c.fields.length) detail.append(fields);
  if (r.kind === "open_email") {
    // the target email as a full row — same block as "based on", with the
    // Webmail link; member lookup carries the gone flag
    const member = s.emails.find((e) => e.id === r.args.email.id) || r.args.email;
    detail.append(emailEl(s, member, "open"));
  }
  if (r.kind === "archive_email") {
    // the targets as full email rows — same block as "based on", with the
    // Webmail link; member lookup carries the gone flag
    const wrap = el("div");
    (r.args.emails || []).forEach((m) => {
      const member = s.emails.find((e) => e.id === m.id) || m;
      wrap.append(emailEl(s, member, "archive"));
    });
    detail.append(wrap);
  }
  // a failed row's error already sits under the meta line (full text
  // once the row is open), so the detail repeats only non-error status text
  if (r.status !== "pending" && r.status_text && !BAD.includes(r.status)) {
    detail.append(el("div", "b-status", r.status_text));
  }
  const rawrow = el("div", "rawrow");
  const rb = el("button", "key rawbtn", "{ } raw json");
  rb.addEventListener("click", (e) => {
    e.stopPropagation();
    detail.classList.toggle("rawopen");
  });
  rawrow.append(rb);
  detail.append(rawrow, jsonEl(r.args));

  return rowEl({
    key, cls: "blk" + (SETTLED.includes(r.status) ? " settled" : ""),
    tile: tileEl(kind.mcp,
                 (r.suggestion && SUGGESTION_TILE[r.kind]) || kind.icon,
                 kind.verb),
    title: c.title, done: r.status === "success",
    meta, why: r.suggestion, links: c.links,
    err: BAD.includes(r.status) ? r.status_text : "",
    amount: c.amount ? amtEl(c.amount) : null,
    status, statusTitle, keys, expand: detail,
  });
}

/* ---- set panels ----------------------------------------------------------- */

function sectEl(blocks) {
  const s = el("div", "sect");
  blocks.forEach((b) => s.append(b));
  return s;
}

function cardEl(s) {
  const p = el("section", "panel card"
    + (isClosed(s) ? " closed" : "") + (isResolved(s) ? " done" : ""));

  const head = el("div", "p-head");
  const t = el("span", "t", s.title);
  /* a resolved set wears the same green check as a finished row */
  if (isResolved(s)) {
    const ok = el("span", "t-done");
    ok.append(icon("check"));
    t.append(ok);
  }
  head.append(t, el("span", "fill"));
  /* escape hatch: hand the set to iris in the webui chat instead (deep link,
     prefilled composer, never auto-sends — email-action-links.md) */
  head.append(chatKey(`Let's handle actions-inbox set ${s.id} by hand: ${s.title}`,
                      "hand this set to iris in chat"));
  /* the set's own key, right of chat — one per state of the set:
     rows still open -> skip all (deny each of them);
     finished -> hide (the card leaves the page);
     stuck (pending, nothing waiting, a row failed) -> retry, which voids the
     set and drops its emails from the ledger; the next scan then proposes
     them again, and the heading says so until one runs. Hiding a stuck set
     instead would leave a pending record no trim ever clears and no page
     ever shows. */
  const open = s.rows.filter((r) => r.status === "pending").length;
  if (isResolved(s)) {
    const hide = el("button", "key", "hide");
    hide.title = "take this finished set off the page";
    armedButton(hide, s.id + "/hide",
                () => post("/api/emails/hide", { set_id: s.id }));
    head.append(hide);
  } else if (open) {
    const skip = el("button", "key", "skip all");
    skip.title = `deny ${open} row${open === 1 ? "" : "s"} — nothing runs`;
    armedButton(skip, s.id + "/skip", () => skipAll(s));
    head.append(skip);
  } else {
    const again = el("button", "key", "retry");
    if (s.rows.some((r) => r.status === "in_progress")) {
      again.disabled = true;
      again.title = "a row is running";
    } else {
      again.title = "void this set — a rescan then proposes its emails again";
      armedButton(again, s.id + "/retry", () => retrySet(s));
    }
    head.append(again);
  }
  head.addEventListener("click", (e) => {
    if (e.target.closest("button, a")) return;
    cardClosed.set(s.id, !isClosed(s));
    renderEmails();
  });
  p.append(head);

  const body = el("div", "c-body");
  body.append(sectEl([analysisEl(s)]));
  body.append(sectEl(s.emails.map((m) => emailEl(s, m))));
  body.append(sectEl(s.rows.map((r) => actionEl(s, r))));
  p.append(body);
  return p;
}

function renderEmails() {
  if (!DATA) return;
  renderedEmails = JSON.stringify(DATA.emails.sets);
  const host = $("#cards-emails");
  host.replaceChildren();
  const order = [...DATA.emails.sets].sort((a, b) => isResolved(a) - isResolved(b));
  for (const s of order) host.append(cardEl(s));
  if (!host.children.length) host.append(emptyEl("inbox is clear"));
}


/* ---- finance cards -------------------------------------------------------- */
/* One ledger card per pick — email proposals under 'from email', the
   scan's 'latest' pick under 'last', its 'random' pick under 'random' —
   one row per proposed transaction (finVisibleCards dedupes the copies a
   transaction proposed by two sources has). Email rows carry a two-tap
   hide key, the email label a hide-all key — both drop proposals through
   the skip endpoint, never transactions. The
   dropdown pre-picks
   the most likely category (the check key stays disabled until a category
   is picked); the two-tap check key writes it — arm, then confirm, same as
   the email approve keys — and the payee-rule checkbox decides whether the
   write also teaches the rule. The checkbox starts indeterminate: the check
   key stays disabled until the user sets it on or off. The header's green
   submit-all key sends every valid row (category picked, rule choice made)
   in one apply call; it stays disabled while no row is valid. A chevron
   key opens
   the row's extra area: the chat link and an inline create-category form
   (group + name, an amber X that closes on one tap, its own two-tap
   accept — the create is its own API call). All row state lives outside
   DATA so it survives polls: picks in finPicks, rule choices in finRule,
   approx choices in finApprox, the extra area's state in finOpen /
   finCreating / finDraft. */

let renderedFinance = null;
const finPicks = new Map();            // transaction id -> picked category
const finRule = new Map();             // transaction id -> payee rule on/off
const finApprox = new Map();           // transaction id -> approx-amount rule on/off
const finOpen = new Set();             // transaction ids with the extra area open
const finCreating = new Set();         // ids whose create-category form is open
const finDraft = new Map();            // id -> {group, name} typed into that form
let finLastGroup = "";                 // group of the last created category

/* filed: the transaction left the uncategorized queue for good — this page
   wrote its category (done), or the write found it already categorized,
   gone, split, or turned transfer (already_handled). These are the rows the
   hide keys take off; a failed row still has a retry waiting. */
const finSettled = (c) => c.status === "done" || c.status === "already_handled";
