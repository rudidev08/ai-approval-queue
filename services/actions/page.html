/* the job stamps move every poll, so the rebuild compare covers the cards
   and picker data only — the heading row repaints separately */
const finSnapshot = () => JSON.stringify(
  [DATA.finance.cards, DATA.finance.error, DATA.finance.categories]);

/* One visible row per transaction: the email copy wins over the scan's
   (and the first of two email copies wins), the hidden copies stay in
   DATA. A write settles every copy at once server-side, and when the
   email card leaves (hidden, or a new batch) the scan row renders again
   on the next rebuild — no rescan involved. */
function finVisibleCards() {
  const seen = new Set();
  const out = [];
  for (const pick of ["email", "latest", "random"]) {
    for (const c of DATA.finance.cards) {
      if (c.pick !== pick || seen.has(c.transaction_id)) continue;
      seen.add(c.transaction_id);
      out.push(c);
    }
  }
  return out;
}

function fmtAmount(a) {
  const n = Number(a);
  return n < 0 ? `-$${a.slice(1)}` : `+$${a}`;
}

/* the dropdown's 'group: name' form of a category. Suggestions may come as
   the bare name (unique across groups by construction); anything not in the
   category list resolves to null, so the check key stays disabled. */
function qualify(name) {
  if (!name) return null;
  if (name.includes(": ")) return name;
  const g = DATA.finance.categories.find((x) => x.categories.includes(name));
  return g ? `${g.group}: ${name}` : null;
}

function finCardEl(c) {
  const id = c.transaction_id;
  const best = c.suggestions && c.suggestions.length ? c.suggestions[0] : null;
  /* the dropdown defaults to the most likely category; an explicit pick wins */
  const cat = qualify(finPicks.get(id) || (best && best.category) || null);

  /* one email-like row, no icon column: payee over one gray meta line
     (date, account, memo), a plain mono amount, then the action keys —
     the expand chevron first, the two-tap accept at the far right */
  /* the category cluster is a pending row's alone; a filed row keeps one
     key, hide, and the extra area belongs to neither */
  let keys = null, more = null;
  if (c.status === "pending") {
    keys = el("span", "fin-keys");
    /* the chevron: first key of the category cluster — it opens the row's
       extra area (chat, create category) */
    const exp = el("button", "key exp");
    exp.append(icon("chevron-down"));
    exp.title = "more options";
    exp.setAttribute("aria-expanded", finOpen.has(id));
    exp.addEventListener("click", () => {
      if (finOpen.has(id)) {
        finOpen.delete(id);
      } else {
        finOpen.add(id);
        /* nothing suggested -> straight into the create form */
        if (!(c.suggestions || []).length) finCreating.add(id);
      }
      renderFinance();
    });
    keys.append(exp);
    /* one optgroup per category group, values in the exact 'group: category'
       form the apply endpoint resolves */
    const sel = el("select", "catsel");
    const ph = el("option", "", "category");
    ph.value = "";
    sel.append(ph);
    for (const g of DATA.finance.categories) {
      const og = document.createElement("optgroup");
      og.label = g.group;
      for (const name of g.categories) {
        const o = el("option", "", name);
        o.value = `${g.group}: ${name}`;
        og.append(o);
      }
      sel.append(og);
    }
    sel.value = cat || "";
    if (sel.value) sel.classList.add("picked");
    if (best && cat && cat === qualify(best.category)) {
      sel.title = best.basis === "email"
        ? "suggested in the mail — check it before applying"
        : best.basis === "guess"
          ? "most likely — a guess, this payee has no category history"
          : "most likely, from this payee's category history";
    }
    sel.addEventListener("change", () => {
      if (sel.value) finPicks.set(c.transaction_id, sel.value);
      else finPicks.delete(c.transaction_id);
      renderFinance();
    });
    keys.append(sel);
    /* accept always sets the category; the payee-rule chip decides whether
       it also teaches the payee rule — it starts indeterminate, and the
       accept key stays disabled until the user sets it on or off */
    const chk = el("label", "key rulechk");
    const box = el("input");
    box.type = "checkbox";
    box.checked = finRule.get(id) === true;
    box.indeterminate = !finRule.has(id);
    box.addEventListener("change", () => {
      finRule.set(id, box.checked);
      renderFinance();
    });
    chk.append(box, "rule");
    keys.append(chk);
    /* approx: with the rule on, anchor it on this row's amount with
       Actual's "is approximately" operator (7.5% window). Inert while
       the rule chip is off or unset */
    const achk = el("label", "key rulechk");
    const abox = el("input");
    abox.type = "checkbox";
    abox.checked = finApprox.get(id) === true;
    abox.disabled = finRule.get(id) !== true;
    abox.addEventListener("change", () => {
      finApprox.set(id, abox.checked);
      renderFinance();
    });
    achk.append(abox, "approx");
    keys.append(achk);
    /* accept: the same two-tap green check key as the inbox action rows —
       first tap arms, second writes */
    const apply = el("button", "sq yes");
    apply.append(icon("check"));
    apply.setAttribute("aria-label", "accept");
    if (!cat) {
      apply.disabled = true;
      apply.title = "pick a category first";
    } else if (!finRule.has(id)) {
      apply.disabled = true;
      apply.title = "set the payee rule on or off first";
    } else if (finWorking()) {
      apply.disabled = true;
      apply.title = "another row is working";
    } else {
      apply.title = !finRule.get(id)
        ? `set '${cat}' — payee rule untouched`
        : finApprox.get(id) === true
          ? `set '${cat}' and teach the payee rule for about this amount`
          : `set '${cat}' and teach the payee rule`;
      armedButton(apply, id + "/apply", () => finApply([{
        transaction_id: id, category: cat,
        update_rule: finRule.get(id) === true,
        approx: finRule.get(id) === true && finApprox.get(id) === true }]));
    }
    keys.append(apply);
    /* email cards only: hide this proposal — the transaction stays
       uncategorized, so a duplicate's scan row shows again at once and
       a future scan can still pick it */
    if (c.pick === "email") {
      const non = el("button", "sq non");
      non.append(icon("x"));
      non.setAttribute("aria-label", "hide");
      non.title = "hide this proposal — the transaction stays uncategorized";
      armedButton(non, id + "/hide",
        () => post("/api/finance/skip", { transaction_id: id, pick: "email" }));
      keys.append(non);
    }

    /* the extra area: chat on the left, the new-category chip on the
       right, the create form on its own line */
    more = el("div", "fin-more" + (finCreating.has(id) ? " creating" : ""));
    const row1 = el("div", "morerow");
    row1.append(chatKey(`Finance: let's discuss transaction ${id} — `
      + `${c.payee || "(no payee)"} ${c.amount} on ${c.date}.`,
      "discuss this transaction in chat"));
    const add = el("button", "key addkey");
    add.append(icon("plus"), "new category");
    add.addEventListener("click", () => {
      finCreating.add(id);
      renderFinance();
    });
    row1.append(add);
    more.append(row1);

    /* the create form: a separate API call, so its own two-tap accept */
    const form = el("div", "newform");
    const draft = finDraft.get(id) || {};
    const grp = el("select", "catsel");
    const gp = el("option", "", "group");
    gp.value = "";
    grp.append(gp);
    for (const g of DATA.finance.categories) {
      const o = el("option", "", g.group);
      o.value = g.group;
      grp.append(o);
    }
    /* the picker starts on the last group a category was created in */
    grp.value = draft.group || finLastGroup || "";
    const inp = el("input");
    inp.placeholder = "category name";
    inp.value = draft.name || "";
    /* typed state survives a rebuild (chip pick, poll with new data) */
    const saveDraft = () => finDraft.set(id, { group: grp.value, name: inp.value });
    const ok = el("button", "sq yes");
    ok.append(icon("check"));
    ok.setAttribute("aria-label", "create category");
    ok.title = "create this category in Actual";
    const valid = () => !!(grp.value && inp.value.trim());
    /* a keystroke mid-request must not re-enable the in-flight key */
    const syncNew = () => { ok.disabled = armedButtonBusy(id + "/create") || !valid(); };
    grp.addEventListener("change", () => { saveDraft(); syncNew(); });
    inp.addEventListener("input", () => { saveDraft(); syncNew(); });
    /* the wire reads this as the state to restore after the request settles,
       so it carries only validity, not the busy guard */
    ok.disabled = !valid();
    armedButton(ok, id + "/create", () => finCreateCategory(c, grp.value, inp.value.trim()));
    /* the X closes the form on one tap — no confirmation */
    const xbtn = el("button", "sq non");
    xbtn.append(icon("x"));
    xbtn.setAttribute("aria-label", "close");
    xbtn.title = "close";
    xbtn.addEventListener("click", () => {
      finCreating.delete(id);
      finDraft.delete(id);
      renderFinance();
    });
    form.append(grp, inp, xbtn, ok);
    more.append(form);
  } else if (finSettled(c)) {
    /* a filed row keeps one key: hide, the same key a saved message row and
       a finished email set get. The transaction is out of the uncategorized
       queue, so no scan proposes it again */
    keys = el("span", "fin-keys");
    const hide = el("button", "key", "hide");
    hide.title = "take this filed transaction off the page";
    armedButton(hide, id + "/hide-filed",
                () => post("/api/finance/hide", { transaction_id: id }));
    keys.append(hide);
  }
  /* done items carry no status line — the title's check says it */
  return rowEl({
    cls: "fin-item" + (c.status === "pending" && finOpen.has(id) ? " open" : ""),
    mainCls: "fin-main",
    title: c.payee || "(no payee)",
    done: c.status === "done" || c.status === "already_handled",
    meta: [[pd(c.date).d.toLocaleDateString("en-US",
             { month: "short", day: "numeric" }), c.account, c.notes,
            c.pick === "email" && c.source && c.source.subject
              ? `mail: ${c.source.subject}` : null]
           .filter(Boolean).join(" · ")],
    err: c.status === "failed" ? c.status_text : "",
    amount: amtEl(c.amount),
    status: (c.status === "in_progress" || c.status === "failed")
      ? STAT[c.status] : null,
    keys, expand: more,
  });
}

function renderFinance() {
  if (!DATA) return;
  renderedFinance = finSnapshot();
  syncSubmitAll();
  const host = $("#cards-finance");
  host.replaceChildren();
  if (DATA.finance.error) host.append(scanErrorEl(DATA.finance.error));
  /* one ledger card per pick — transactions proposed from a mail first,
     then the newest uncategorized, then the random older ones — each under
     a small-caps label with its row count. Inside a card, completed rows
     sink to the bottom, order otherwise unchanged */
  const visible = finVisibleCards();
  for (const [pick, label] of [["email", "from email"], ["latest", "last"],
                               ["random", "random"]]) {
    const cards = visible.filter((c) => c.pick === pick)
      .sort((a, b) => finSettled(a) - finSettled(b));
    if (!cards.length) continue;
    const lab = el("div", "fin-label", `${label} ${cards.length}`);
    if (pick === "email") {
      /* hide all: drops every email card — the transactions stay
         uncategorized, and a duplicate's scan row shows again at once */
      const hide = el("button", "key", "hide all");
      hide.title = "hide every email proposal — the transactions stay uncategorized";
      armedButton(hide, "fin-email-hide-all",
        () => post("/api/finance/skip", { pick: "email" }));
      lab.append(hide);
    }
    host.append(lab);
    const p = el("section", "panel card fin");
    for (const c of cards) p.append(finCardEl(c));
    host.append(p);
  }
  if (!host.children.length) host.append(emptyEl("everything is categorized"));
}


/* ---- finance report ------------------------------------------------------- */
/* No cards: the part keys pick a part of the daily report — full is
   the whole body, the rest one component alone. The create-preview key runs
   the report script in write-free mode for the picked part (--section), and
   the service keeps each part's last build in memory, so a part key switches
   the panel to that part's cached text with no new run.
   The panel is the picked part's text alone — the build that produced it, or
   the failure that replaced it. The heading row carries the state; a build
   takes a minute or two (seconds for the no-LLM parts), so the key greys and
   the heading counts it up, naming the part under way. */

let renderedReport = null;

/* the part keys, both rows: the picked look and the taps are the same on all
   of them */
const REP_KEYS = document.querySelectorAll("#area-report .key.part");

/* heading labels per part name */
const REP_LABELS = { full: "full report", summary: "summary",
                     cashflow: "cash flow", lenses: "lenses", odd: "odd",
                     new: "new transactions", links: "links" };

/* the picked part key: what the panel shows and what the create-preview key builds */
let repPicked = "full";

const repBuilding = () => !!(DATA && DATA.finance_report.building_since);
/* the seconds between the tap and the service reporting the build, and the
   part that tap asked for */
let repStartingAt = 0;
let repStartingPart = "full";

const repSnapshot = () => JSON.stringify(
  [DATA.finance_report.reports[repPicked], repPicked, repBuilding()]);

function repLine() {
  if (!DATA) return;
  const fr = DATA.finance_report;
  const since = fr.building_since ? Date.parse(fr.building_since) : null;
  if (since) {
    repStartingAt = 0;
    $("#rep-line").replaceChildren(
      el("span", "wrk", `building ${REP_LABELS[fr.building_section] || ""} `
                        + `(${dur(Date.now() - since)})`));
    return;
  }
  if (Date.now() - repStartingAt < 30000) {
    $("#rep-line").replaceChildren(
      el("span", "wrk", `starting ${REP_LABELS[repStartingPart]} build…`));
    return;
  }
  /* past the build states, the line belongs to the picked part's cache */
  const rep = fr.reports[repPicked];
  if (!rep) {
    $("#rep-line").textContent = `no ${REP_LABELS[repPicked]} preview yet`;
    return;
  }
  const built = `built ${ago(Date.now() - Date.parse(rep.built_at))}`;
  if (rep.error) {
    $("#rep-line").replaceChildren(el("span", "bad", "last build failed"),
                                   `, ${built}`);
    return;
  }
  $("#rep-line").textContent = built;
}

function renderReport() {
  renderedReport = repSnapshot();
  for (const b of REP_KEYS)
    b.classList.toggle("picked", b.dataset.part === repPicked);
  const host = $("#cards-finance-report");
  host.replaceChildren();
  const rep = DATA.finance_report.reports[repPicked];
  if (!rep) return;
  const panel = el("section", "panel");
  const body = el("div", "c-body");
  body.append(el("pre", "rawtext report", rep.error || rep.text));
  panel.append(body);
  host.append(panel);
}

/* the create-preview key: the service answers at once and builds on its own thread,
   so the tap only starts the clock — a refused call puts the line back */
async function startReport() {
  repStartingAt = Date.now();
  repStartingPart = repPicked;
  repLine();
  if (await post("/api/finance-report/preview", { section: repPicked })) {
    setTimeout(poll, 2000);
  } else {
    repStartingAt = 0;
    repLine();
  }
}

/* ---- research ------------------------------------------------------------- */
/* One expandable row per vault web-research topic: the topic's name, a meta
   line with its cadence prefix and last successful run, and its own green
   run key and amber delete key. While the driver's log shows consecutive
   failures the row carries an amber "failed ×N" status word; while the
   driver's in-flight marker shows a run, a green "running" one. A chevron key
   (or a tap on the row) opens it: the topic's prompt and the stored
   report's text in their own banded blocks, read from the service on the
   first open and kept while the report's updated stamp stays the same; a
   failing open row also holds the two-tap clear key. Run spawns
   the research driver detached: the row reads "started", then "running"
   while the marker stays fresh, and the finished report arrives by email
   like a batch run's; delete drops the topic's stored report and failure dump, so
   its next run starts from scratch. The batch is one cron job, so the next
   batch time sits in the heading line, not on the rows. */

let renderedResearch = null;
/* slug -> stamp of the run this page started: the row reads "started" for
   ten seconds after the tap — the bridge until the driver's marker reaches
   the page's state — then falls back to the topic's stored state.
   tick() re-renders while any stamp lives, so the note expires on its own */
const resStarted = new Map();

const resSnapshot = () => JSON.stringify(DATA.research);

/* the slug without its cadence prefix for the name, the prefix for the meta */
const resName = (slug) => slug.replace(/^(daily|weekly)-/, "");
const resCadence = (slug) => (slug.match(/^(daily|weekly)-/) || [])[1] || "";

/* the heading line: the topic count, a green count of runs in flight, an
   amber count of the failing ones, and the batch job's next run */
function resLine() {
  if (!DATA) return;
  const line = $("#res-line");
  const r = DATA.research;
  if (!r.topics.length) {
    line.textContent = "no topics yet";
    return;
  }
  const runs = r.topics.filter((t) => t.running).length;
  const fails = r.topics.filter((t) => t.failing).length;
  const bits = [`${r.topics.length} topic${r.topics.length === 1 ? "" : "s"}`];
  if (runs) bits.push(", ", el("span", "wrk", `${runs} running`));
  if (fails) bits.push(", ", el("span", "bad", `${fails} failing`));
  if (r.next_batch)
    bits.push(`, next batch in ${tinyDur(Date.parse(r.next_batch) - Date.now())}`);
  line.replaceChildren(...bits);
}

/* an open row's content — the topic's prompt and the report's text — read
   from the service on the first open and kept while the report's updated
   stamp stays the same, so a finished run or a delete triggers a re-read.
   Map: slug -> {for: the stamp the read was made under, state:
   loading|ok|error, question, text, updated} */
const resBody = new Map();

async function fetchResearchBody(slug, stamp) {
  resBody.set(slug, { for: stamp, state: "loading" });
  let entry;
  try {
    const res = await fetch("/api/research/report?slug="
      + encodeURIComponent(slug));
    const out = await res.json().catch(() => ({}));
    entry = res.ok
      ? { for: stamp, state: "ok", question: out.question || "",
          text: out.report, updated: out.updated }
      : { for: stamp, state: "error",
          text: out.error || `could not read the report (${res.status})` };
  } catch {
    entry = { for: stamp, state: "error", text: "the service is unreachable" };
  }
  resBody.set(slug, entry);
  renderResearch();
}

function resDetailEl(t) {
  const detail = el("div", "b-detail");
  if (t.failing) {
    const wrap = el("div");
    const clear = el("button", "key amber", "clear failure");
    clear.title = "clear the failure flag — it comes back if the next run fails too";
    armedButton(clear, `research-clear/${t.slug}`,
      () => post("/api/research/clear", { slug: t.slug }));
    wrap.append(clear);
    detail.append(wrap);
  }
  /* the fetch starts on the open, so a closed row costs nothing */
  const got = resBody.get(t.slug);
  if (got === undefined || got.for !== t.updated)
    fetchResearchBody(t.slug, t.updated);
  const shown = resBody.get(t.slug);
  if (shown && shown.state === "ok") {
    detail.append(el("div", "b-status", "prompt"));
    detail.append(el("pre", "rawtext", shown.question));
    if (shown.text == null) {
      detail.append(el("div", "b-status", "no report yet"));
    } else {
      detail.append(el("div", "b-status",
        "report" + (shown.updated ? " · updated " + shown.updated : "")));
      detail.append(el("pre", "rawtext", shown.text));
    }
  } else if (shown && shown.state === "error") {
    detail.append(el("div", "b-err", shown.text));
  } else {
    detail.append(el("div", "b-status", "reading…"));
  }
  return detail;
}

function resRowEl(t) {
  const key = "research/" + t.slug;
  const bits = [];
  const cad = resCadence(t.slug);
  if (cad) bits.push(cad);
  if (t.last_run) {
    bits.push("ran " + ago(Date.now() - Date.parse(t.last_run)));
    if (!t.report) bits.push("no report yet");
  } else {
    bits.push("no run yet");
  }
  let status = null;
  let statusTitle = null;
  const since = resStarted.get(t.slug);
  if (t.running) {
    resStarted.delete(t.slug);
    status = ["running", "wrk"];
    statusTitle = "a run is in flight — the finished report arrives by email";
  } else if (since && Date.now() - since < 10000) {
    status = ["started", "wrk"];
    statusTitle = "the run started — the finished report arrives by email";
  } else {
    resStarted.delete(t.slug);
    if (t.failing) {
      status = [`failed ×${t.failing}`, "bad"];
      statusTitle = "consecutive failed runs — the clear key sits in the open row";
    }
  }
  const keys = el("span", "upkeys");
  /* the chevron: first key of the cluster, same as the finance rows — it
     opens the topic's prompt and report */
  const exp = el("button", "key exp");
  exp.append(icon("chevron-down"));
  exp.title = "show the topic's prompt and report";
  exp.setAttribute("aria-expanded", openBlocks.has(key));
  exp.addEventListener("click", () => {
    if (openBlocks.has(key)) openBlocks.delete(key); else openBlocks.add(key);
    renderResearch();
  });
  keys.append(exp);
  const run = el("button", "key green", "run");
  run.title = "run this topic now instead of waiting for its batch — the finished report arrives by email";
  armedButton(run, `research-run/${t.slug}`, () => startResearchRun(t.slug));
  const del = el("button", "key amber", "delete");
  if (t.report || t.error) {
    del.title = "delete this topic's report — the topic stays; its next run starts from scratch";
    armedButton(del, `research-delete/${t.slug}`,
      () => post("/api/research/delete", { slug: t.slug }));
  } else {
    del.disabled = true;
    del.title = "no report to delete";
  }
  keys.append(run, del);
  return rowEl({ key, onToggle: renderResearch, cls: "blk",
                 title: resName(t.slug),
                 meta: [bits.join(" · ")],
                 status, statusTitle, keys,
                 expand: openBlocks.has(key) ? resDetailEl(t) : null });
}

function renderResearch() {
  if (!DATA) return;
  renderedResearch = resSnapshot();
  const host = $("#cards-research");
  host.replaceChildren();
  const topics = DATA.research.topics;
  if (!topics.length) {
    host.append(emptyEl("no topics yet"));
    return;
  }
  const p = el("section", "panel");
  for (const t of topics) p.append(resRowEl(t));
  host.append(p);
}

/* the run key: the stamp turns the row's status to "started" at the firing
   tap, and a refused call puts it back; the driver writes the report file
   itself when it finishes, so there is nothing to poll for here */
async function startResearchRun(slug) {
  resStarted.set(slug, Date.now());
  renderResearch();
  if (!await post("/api/research/run", { slug })) {
    resStarted.delete(slug);
    renderResearch();
  }
}


/* ---- messages cards ------------------------------------------------------- */
/* One row per proposed attachment: the LLM's clean filename over a gray meta
   line (sender's contact name when the service resolved one, chat, date) and
   its one-line reason. The dropdown offers
   every records location with the LLM's pick preselected; the two-tap check
   saves to the picked location, the two-tap X denies — a denied attachment
   never comes back (the service's ledger remembers every verdict). A failed
   save keeps the row actionable: the error text shows above the keys and the
   check retries. A chevron key (rows whose attachment yielded text) opens the
   extracted text under the row, closed until first tap. Dropdown picks and
   open rows live outside DATA so they survive polls. */

let renderedMessages = null;
const msgPicks = new Map();            // attachment id -> picked location id
const msgOpen = new Set();             // attachment ids with the text area open

const msgWorking = () =>
  !!(DATA && DATA.messages.cards.some((c) => c.status === "in_progress"));

/* the scan stamps move every poll, so the rebuild compare covers the cards,
   the error record, and the catalog only — the heading line repaints
   separately */
const msgSnapshot = () => JSON.stringify(
  [DATA.messages.cards, DATA.messages.error, DATA.messages.locations]);

/* the messages area's own scan state, same roles as the finance pair */
const msgScanning = () => !!(DATA && DATA.messages.job_running_since);
let msgScanStartingAt = 0;

/* the messages heading row's scan status: last-run time, a running
   indicator with elapsed time, and a failed marker when the last run or
   scan failed — same shape as the finance line */
function msgJobLine() {
  if (!DATA) return;
  const m = DATA.messages;
  const jobAt = m.job_last_run_at ? Date.parse(m.job_last_run_at) : null;
  const lastRan = `last ran ${jobAt ? ago(Date.now() - jobAt) : "never"}`;
  const since = m.job_running_since ? Date.parse(m.job_running_since) : null;
  if (since) {
    msgScanStartingAt = 0;
    $("#msg-job-line").replaceChildren(
      el("span", "wrk", `scanning (${dur(Date.now() - since)})`), `, ${lastRan}`);
    return;
  }
  if (Date.now() - msgScanStartingAt < 30000) {
    $("#msg-job-line").replaceChildren(el("span", "wrk", "starting scan…"));
    return;
  }
  const parts = [];
  if (m.job_last_failed || (m.last_scan_status && m.last_scan_status !== "ok"))
    parts.push(el("span", "bad", "last scan failed"), ", ");
  parts.push(lastRan);
  $("#msg-job-line").replaceChildren(...parts);
}

function msgCardEl(c) {
  const id = c.attachment_id;
  const meta = [[c.sender_name || c.sender, c.chat,
    pd(c.received_at).d
    .toLocaleDateString("en-US", { month: "short", day: "numeric" }),
    c.original_name !== c.filename ? c.original_name : ""]
    .filter(Boolean).join(" · ")];
  if (c.reason) meta.push(c.reason);
  /* pending and failed rows both take actions — a failed save retries with
     the check key */
  let keys = null;
  if (c.status === "pending" || c.status === "run_failed") {
    keys = el("span", "fin-keys");
    /* the chevron: first key of the cluster, same as the finance rows — it
       opens the attachment's extracted text; rows without text have none */
    if (c.text) {
      const exp = el("button", "key exp");
      exp.append(icon("chevron-down"));
      exp.title = "show the attachment's text";
      exp.setAttribute("aria-expanded", msgOpen.has(id));
      exp.addEventListener("click", () => {
        if (msgOpen.has(id)) msgOpen.delete(id); else msgOpen.add(id);
        renderMessages();
      });
      keys.append(exp);
    }
    const sel = el("select", "catsel");
    const ph = el("option", "", "destination");
    ph.value = "";
    sel.append(ph);
    for (const l of DATA.messages.locations) {
      const o = el("option", "", l.label);
      o.value = l.id;
      sel.append(o);
    }
    sel.value = msgPicks.get(id) || c.location_id;
    if (sel.value) sel.classList.add("picked");
    sel.addEventListener("change", () => {
      if (sel.value) msgPicks.set(id, sel.value);
      else msgPicks.delete(id);
      renderMessages();
    });
    keys.append(sel);
    const yes = el("button", "sq yes");
    yes.append(icon("check"));
    yes.setAttribute("aria-label", "save");
    if (!sel.value) {
      yes.disabled = true;
      yes.title = "pick a destination first";
    } else if (msgWorking()) {
      yes.disabled = true;
      yes.title = "another row is working";
    } else {
      yes.title = `save to ${sel.selectedOptions[0].textContent}`;
      armedButton(yes, id + "/save", () => msgResolve(c, "approve"));
    }
    keys.append(yes);
    const non = el("button", "sq non");
    non.append(icon("x"));
    non.setAttribute("aria-label", "deny");
    if (msgWorking()) {
      non.disabled = true;
      non.title = "another row is working";
    } else {
      non.title = "deny — never propose this attachment again";
      armedButton(non, id + "/deny", () => msgResolve(c, "deny"));
    }
    keys.append(non);
  } else if (c.status === "success") {
    /* a saved row keeps one key: hide, the same key a finished email set
       gets — the next scan would drop the row anyway */
    keys = el("span", "fin-keys");
    const hide = el("button", "key", "hide");
    hide.title = "take this saved row off the page";
    armedButton(hide, id + "/hide",
                () => post("/api/messages/hide", { attachment_id: c.attachment_id }));
    keys.append(hide);
  }
  /* the attachment's extracted text, shown by the chevron (fin-more, same as
     the finance extra area); starts closed — msgOpen is empty until a tap */
  let more = null;
  if (c.text) {
    more = el("div", "fin-more");
    more.append(el("pre", "rawtext", c.text));
  }
  return rowEl({
    cls: "fin-item" + (msgOpen.has(id) && c.text ? " open" : ""),
    mainCls: "fin-main",
    title: c.filename,
    done: c.status === "success",
    meta,
    err: c.status === "run_failed" ? c.status_text : "",
    status: c.status === "in_progress" ? STAT[c.status] : null,
    keys, expand: more,
  });
}

function renderMessages() {
  if (!DATA) return;
  renderedMessages = msgSnapshot();
  const host = $("#cards-messages");
  host.replaceChildren();
  if (DATA.messages.error) host.append(scanErrorEl(DATA.messages.error));
  /* finished rows sink to the bottom, order otherwise unchanged */
  const cards = [...DATA.messages.cards]
    .sort((a, b) => (a.status === "success") - (b.status === "success"));
  if (cards.length) {
    const p = el("section", "panel card fin");
    for (const c of cards) p.append(msgCardEl(c));
    host.append(p);
  }
  if (!host.children.length) host.append(emptyEl("no attachments waiting"));
}

/* "skip all": deny every card still waiting, one call at a time — the same
   loop the email sets' skip-all key runs */
async function msgSkipAll() {
  for (const c of [...DATA.messages.cards]) {
    if (c.status !== "pending" && c.status !== "run_failed") continue;
    await msgResolve(c, "deny");
  }
  poll();
}

async function msgResolve(c, decision) {
  /* a poll replaces DATA wholesale, so work on the live card; the keys leave
     the row at the firing tap and a refused call puts the real status back */
  const live = DATA.messages.cards
    .find((x) => x.attachment_id === c.attachment_id);
  if (!live || live.status === "in_progress") { poll(); return; }
  const prev = { status: live.status, status_text: live.status_text };
  live.status = "in_progress";
  live.status_text = "working";
  renderMessages();
  const payload = { attachment_id: c.attachment_id, decision };
  if (decision === "approve")
    payload.location_id = msgPicks.get(c.attachment_id) || c.location_id;
  try {
    const res = await fetch("/api/messages/resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Actions-Local": "1" },
      body: JSON.stringify(payload),
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 202) {
      msgPicks.delete(c.attachment_id);
      pacePoll();
      return;
    }
    if (res.ok) {   /* deny: the card is gone server-side */
      DATA.messages.cards = DATA.messages.cards
        .filter((x) => x.attachment_id !== c.attachment_id);
      msgPicks.delete(c.attachment_id);
      renderMessages();
      return;
    }
    Object.assign(live, prev);
    if (body.error) alert(body.error);
    renderMessages();
    if (res.status === 409) poll();  /* stale view: refetch */
  } catch {
    Object.assign(live, prev);
    renderMessages();
    failed = true;
    tick();
  }
}


/* ---- Hermes audit cards ---------------------------------------------------- */
/* One card per category that came back with findings, in report order. A
   clean category has nothing to act on, so it only gets its name in the line
   under the cards. Starting a run clears the lot: the record is reseeded with
   every category waiting, and the starting window covers the seconds before
   that lands. Each card's copy key puts that category's block on the
   clipboard, findings and notes as the report writes them.

   Each finding's x key hides it for the rest of the pass — reviewed, no
   action wanted. The service takes those findings out before the page ever
   sees them, so what stays is what the card draws; the header line counts
   what went, and the restore key brings it all back. The next run
   restores everything on its own. */

let renderedAudit = null;

const auditSnapshot = () => JSON.stringify(
  [DATA.hermes_audit.run && DATA.hermes_audit.run.categories,
   DATA.hermes_audit.error, auditStarting()]);

/* the report's own wording for one category, for pasting elsewhere */
function auditText(c, n) {
  /* what is dismissed is off this block but still in the report the last line
     points at, so the count says so rather than disagreeing with it */
  const hid = c.dismissed ? ` (${c.dismissed} more dismissed here, in the`
                            + " report)" : "";
  const head = c.findings.length
    ? `${n}. ${c.label}: warn — ${c.findings.length} finding`
      + (c.findings.length === 1 ? "" : "s") + hid
    : `${n}. ${c.label}: ok${hid}`;
  return [head, ...c.findings.map((f) => `   - ${f}`),
          ...c.notes.map((t) => `   * ${t}`),
          "full report: ~/Iris/hermes-audit-report.md"].join("\n") + "\n";
}

/* the old selection copy: the tailnet http address is not a secure context, so
   navigator.clipboard does not exist there, and Safari refuses the modern call
   in cases the phone bookmark hits — this is what copies in both */
function selectionCopy(text) {
  const ta = el("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.append(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  return ok;
}

async function copyText(text, key) {
  let ok = false;
  if (navigator.clipboard) {
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch { /* refused — the selection copy below is the fallback */ }
  }
  if (!ok && !selectionCopy(text)) {
    alert("could not copy");
    return;
  }
  key.replaceChildren(icon("copy"), "copied");
  setTimeout(() => key.replaceChildren(icon("copy"), "copy"), 1500);
}

function copyKey(text, title) {
  const key = el("button", "key");
  key.append(icon("copy"), "copy");
  key.title = title;
  key.addEventListener("click", () => copyText(text, key));
  return key;
}

/* the stderr of a run that ended without writing a report — a stopped run
   leaves none, a crashed one leaves the traceback, and a start that never
   reached audit.py leaves whatever uv said */
function auditErrorEl(text, started) {
  const p = el("section", "panel card aud");
  const head = el("div", "p-head");
  head.append(el("span", "t", started ? "no report from the last run"
                                      : "last run could not start"),
              el("span", "fill"),
              copyKey(text + "\n", "copy the run's error output"));
  p.append(head);
  const body = el("div", "c-body");
  body.append(el("div", "aud-find", text));
  p.append(body);
  return p;
}

/* one finding plus its dismiss key: reviewed, no action wanted, off the page
   until the next pass reseeds the record. Same amber x chip the inbox rows
   deny with, and the same two-tap arming — the finding text is unique inside
   its category, so the armed state survives a re-render */
function auditFindEl(c, f) {
  const row = el("div", "aud-find");
  row.append(el("span", "b-text", f));
  const non = el("button", "sq non");
  non.append(icon("x"));
  non.setAttribute("aria-label", "dismiss this finding");
  non.title = "hide this finding until the next run";
  armedButton(non, `aud/${c.label}/${f}`, () =>
    post("/api/hermes-audit/dismiss", { category: c.label, finding: f }));
  const sqs = el("div", "sqs");
  sqs.append(non);
  row.append(sqs);
  return row;
}

function auditCardEl(c, n) {
  const p = el("section", "panel card aud");
  const head = el("div", "p-head");
  head.append(el("span", "t", `${n}. ${c.label}`), el("span", "fill"),
    el("span", "m", `${c.findings.length} finding`
      + (c.findings.length === 1 ? "" : "s")),
    copyKey(auditText(c, n), "copy this category's findings"));
  p.append(head);
  const body = el("div", "c-body");
  for (const f of c.findings) body.append(auditFindEl(c, f));
  for (const t of c.notes) body.append(el("div", "aud-note", t));
  p.append(body);
  return p;
}

function renderAudit() {
  if (!DATA) return;
  renderedAudit = auditSnapshot();
  const host = $("#cards-audit");
  const clean = $("#aud-clean");
  host.replaceChildren();
  clean.textContent = "";
  clean.removeAttribute("title");
  $("#aud-restore").disabled = !armedButtonBusy("audit-restore");
  const run = DATA.hermes_audit.run;
  /* between the tap and the child taking the lock the record still holds the
     previous pass, and those cards are answered for */
  if (auditStarting()) return;
  if (DATA.hermes_audit.error)
    host.append(auditErrorEl(DATA.hermes_audit.error,
                             !!run && !run.finished_at));
  if (!run) return;
  const cats = run.categories || [];
  /* a card whose findings are all dismissed leaves the page; the line below
     is where it is still named, so a warn category never vanishes silently */
  cats.forEach((c, i) => {
    if (c.state === "warn" && c.findings.length) host.append(auditCardEl(c, i + 1));
  });
  /* a card whose findings are all dismissed leaves the page, and a category
     with no findings never had one — the heading counts both, and names them
     in its tooltip. The restore key is what undoes a dismissal. */
  const ok = cats.filter((c) => c.state === "ok").map((c) => c.label);
  const hid = cats.filter((c) => c.dismissed);
  const dismissed = hid.reduce((n, c) => n + c.dismissed, 0);
  $("#aud-restore").disabled = !dismissed || armedButtonBusy("audit-restore");
  const bits = [];
  if (ok.length) bits.push(`${ok.length} clean`);
  if (dismissed) bits.push(`${dismissed} dismissed`);
  if (!bits.length) return;
  clean.textContent = ", " + bits.join(", ");
  const tip = [];
  if (ok.length)
    tip.push((run.finished_at ? "no findings: " : "no findings so far: ")
      + ok.join(", "));
  if (dismissed)
    tip.push("dismissed: "
      + hid.map((c) => `${c.dismissed} in ${c.label}`).join(", "));
  clean.title = tip.join("\n");
}

/* the rows whose green check key would fire right now: pending, a category
   picked or suggested, the payee-rule choice made — the submit-all key
   sends exactly these. Visible cards only: a hidden duplicate would put
   the same transaction_id in the items twice, which apply refuses whole */
function finValidItems() {
  if (!DATA) return [];
  const out = [];
  for (const c of finVisibleCards()) {
    if (c.status !== "pending") continue;
    const id = c.transaction_id;
    const best = c.suggestions && c.suggestions.length ? c.suggestions[0] : null;
    const cat = qualify(finPicks.get(id) || (best && best.category) || null);
    if (!cat || !finRule.has(id)) continue;
    out.push({ transaction_id: id, category: cat,
               update_rule: finRule.get(id) === true,
               approx: finRule.get(id) === true && finApprox.get(id) === true });
  }
  return out;
}

/* the submit-all key: enabled only while at least one row is valid and no
   row is working. The apply call returns 202 as soon as the job is
   claimed, so armed-button's own in-flight look ends seconds before the
   rows settle — the key carries the busy chip for as long as a row works,
   which is why the class is set here and not left to armed-button. Runs on
   every poll (renderMeta) and every finance rebuild. */
function syncSubmitAll() {
  const b = $("#fin-submit-all");
  const n = finValidItems().length;
  const busy = armedButtonBusy("fin-submit-all") || finWorking();
  b.disabled = busy || !n;
  b.classList.toggle("inflight", busy);
  b.title = busy ? "a write is running"
          : n ? `submit ${n} row${n === 1 ? "" : "s"} in one write`
              : "no row is ready — each needs a category and a payee-rule choice";
}

async function finApply(items) {
  /* one call for one row's check key or the submit-all key. A poll replaces
     DATA wholesale, so resolve every item against the live cards — a row
     pruned since the render is dropped here */
  const prev = new Map();
  const live = [];
  for (const it of items) {
    const c = DATA.finance.cards.find(
      (x) => x.transaction_id === it.transaction_id);
    if (!c || c.status !== "pending") continue;
    prev.set(c.transaction_id, { status: c.status, status_text: c.status_text });
    live.push(c);
  }
  if (!live.length) { poll(); return; }
  /* the keys leave the rows at the firing tap: the green [in progress]
     shows the call is on its way even when the response takes a while; a
     refused call puts the rows' real status back */
  for (const c of live) {
    c.status = "in_progress";
    c.status_text = "working";
  }
  renderFinance();
  try {
    const res = await fetch("/api/finance/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Actions-Local": "1" },
      body: JSON.stringify({
        items: items.filter((it) => prev.has(it.transaction_id)) }),
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 202) {
      for (const c of live) {
        const id = c.transaction_id;
        finPicks.delete(id);
        finRule.delete(id);
        finApprox.delete(id);
        finOpen.delete(id);
        finCreating.delete(id);
        finDraft.delete(id);
      }
      pacePoll();
      return;
    }
    for (const c of live) Object.assign(c, prev.get(c.transaction_id));
    if (body.error) alert(body.error);
    renderFinance();
    if (res.status === 409) poll();  /* stale view: refetch */
  } catch {
    for (const c of live) Object.assign(c, prev.get(c.transaction_id));
    renderFinance();
    failed = true;
    tick();
  }
}

/* the create-category call: the accept key stays in flight until the write
   settles. On success the new category enters the local picker data
   and is picked — the api-cache copy is fresh after the write, so the next
   poll confirms it from the server */
async function finCreateCategory(c, group, name) {
  const id = c.transaction_id;
  try {
    const res = await fetch("/api/finance/create-category", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Actions-Local": "1" },
      body: JSON.stringify({ name, group }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      alert(body.error || `create failed (${res.status})`);
      return;
    }
    finLastGroup = group;
    finCreating.delete(id);
    finDraft.delete(id);
    const g = DATA.finance.categories.find((x) => x.group === group);
    if (g) g.categories.push(name);
    else DATA.finance.categories.push({ group, categories: [name] });
    finPicks.set(id, body.category);
    renderFinance();
    poll();
  } catch {
    failed = true;
    tick();
  }
}

async function startFinScan() {
  /* the key greys and the line says "starting scan…" at the firing tap —
     also against a poll re-enabling the key mid-request; a refused call
     puts both back */
  finScanStartingAt = Date.now();
  finJobLine();
  if (await post("/api/finance/uncategorized", {})) {

}

/* the messages rescan key: same tap feedback as the finance one — grey and
   "starting scan…" until a poll sees the run in hermes' ledger */
async function startMsgScan() {
  msgScanStartingAt = Date.now();
  msgJobLine();

/* ---- actions ------------------------------------------------------------- */

async function decide(s, r, decision) {
  /* a poll replaces DATA wholesale, so s and r may be detached render-time
     copies — mutate the live objects, or the row keeps reading pending and
     its keys come back enabled */
  const live = DATA.emails.sets.find((x) => x.id === s.id);
  const row = live && live.rows.find((x) => x.id === r.id);
  if (!row) { poll(); return; }
  /* the keys leave the row at the firing tap: the green [in progress] shows
     the call is on its way even when the response takes a while; a refused
     call puts the row's real status back */
  const prev = { status: row.status, status_text: row.status_text };
  row.status = "in_progress";
  row.status_text = "working";
  renderEmails();
  try {
    const res = await fetch("/api/emails/resolve", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Actions-Local": "1" },
      body: JSON.stringify({ set_id: live.id, row_id: row.id, decision,
                             args_sha256: row.args_sha256 }),
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 202) {
      pacePoll();
      return;
    }
    Object.assign(row, body.row || prev);
    renderEmails();
    if (res.status === 409) poll();  /* stale view: row re-rendered, now refetch */
  } catch {
    Object.assign(row, prev);
    renderEmails();
    failed = true;
    tick();
  }
}

/* "retry": void the stuck set, so its emails leave the ledger. They come
   back as proposals on the next scan and not before — a scan only ever
   offers emails the ledger does not hold — so the heading says to run one */
async function retrySet(s) {
  if (await post("/api/emails/reset", { set_id: s.id })) {
    retriedAt = Date.now();
    jobLine();
  }
}

/* "skip all": deny every pending row of the set, one call at a time. Each
   decide() rebuilds the cards; armedButton's registry keeps the rebuilt key
   disabled and pulsing until this whole loop settles */
async function skipAll(s) {
  for (const r of s.rows) {
    if (r.status !== "pending") continue;
    await decide(s, r, "deny");
  }
  poll();
}

async function post(path, body) {
  let ok = false;
  try {
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Actions-Local": "1" },
      body: JSON.stringify(body),
    });
    ok = res.ok;
    if (!ok) {
      /* a refused call (e.g. 409 in-progress on reset) must not read as
         success */
      const out = await res.json().catch(() => ({}));
      alert(out.error || `${path} failed (${res.status})`);
    }
  } catch {
    failed = true;
    tick();
    return false;
  }
  poll();
  return ok;
}

async function startScan() {
  /* the claim row lands in hermes' ledger moments after the spawn; one
     early poll shows "scanning" without waiting out the minute, and the
     placeholder covers the gap until then. The stamp is set at the firing
     tap — the key greys and the line says "starting scan…" right away, and
     a poll landing mid-request cannot re-enable the key; a refused call
     puts both back */
  scanStartingAt = Date.now();
  jobLine();
  if (await post("/api/emails/rescan", {})) {
    setTimeout(poll, 2000);
  } else {
    scanStartingAt = 0;
    jobLine();
  }
}
armedButton($("#rescan"), "rescan-emails", startScan);
/* both keys re-derive their own state from the data that landed: the poll
   inside the call is not awaited, so armed-button's re-enable would
   otherwise leave a key bright on an empty area */
armedButton($("#emails-hide"), "emails-hide-finished",

armedButton($("#fin-hide"), "fin-hide-finished",

armedButton($("#msg-hide"), "messages-hide-finished",

armedButton($("#msg-skip"), "messages-skip-all",

armedButton($("#fin-rescan"), "rescan-finance", startFinScan);
armedButton($("#rep-build"), "preview-finance-report", startReport);

for (const b of REP_KEYS) {
  b.title = "show this part's last build — the create-preview key rebuilds the picked part";

}

  () => post("/api/messages/reset", {})
    .then((ok) => ok && new Promise((r) => setTimeout(r, 5000))));
/* the items are gathered at the confirming tap, so picks made between arm

   rows keep working past the 202. */
armedButton($("#fin-submit-all"), "fin-submit-all",
  () => finApply(finValidItems()).finally(
    () => setTimeout(syncSubmitAll)));
/* both keys restart a launchd agent that loads the tool-approvals plugin at
   start; nothing on this page changes, so neither re-derives any state */
armedButton($("#sys-gateway"), "system-restart-gateway",
  () => post("/api/system/restart-gateway", {}));
armedButton($("#sys-webui"), "system-restart-webui",
  () => post("/api/system/restart-webui", {}));
/* the audit's own starting window: uv plus the script's own start-up sit
   between the tap and the lock, and until it is held the state still reads
   "not running". The stamp greys the keys and clears the previous pass's
   cards at the tap; a refused call puts both back. */
async function startAudit() {
  auditStartingAt = Date.now();
  auditPaint();
  if (await post("/api/hermes-audit/run", {})) {
    setTimeout(poll, 2000);
  } else {
    auditStartingAt = 0;
    auditPaint();
  }
}
/* a reset that lands stamps the moment so the header line can read "reset
   successful"; a refused call (409 while a run holds the lock) shows nothing */
async function resetAudit() {
  if (await post("/api/hermes-audit/reset", {})) {
    auditResetAt = Date.now();
    auditPaint();
  }
}
function auditPaint() {
  if (DATA) renderMeta();
  renderAudit();
}
/* armed-button re-enables a key when its request settles, so each key
   re-derives all three from the state that landed — otherwise the run key
   flashes back on while the run holds the lock */
const auditKey = (call) => () => call().finally(() => setTimeout(auditPaint));
armedButton($("#aud-run"), "audit-run", auditKey(startAudit));
armedButton($("#aud-stop"), "audit-stop",
  auditKey(() => post("/api/hermes-audit/stop", {})));
armedButton($("#aud-reset"), "audit-reset", auditKey(resetAudit));
armedButton($("#aud-restore"), "audit-restore",
  auditKey(() => post("/api/hermes-audit/restore", {})));
/* success holds the reset key in flight 5 s so the tap visibly landed */
armedButton($("#reset-all"), "reset-reviewed",
  () => post("/api/emails/reset", { all: true })
    .then((ok) => ok && new Promise((r) => setTimeout(r, 5000))));
poll();
setInterval(poll, 60000);
/* the age text moves between polls, so a stalled service still reads as a
   growing amber age rather than a frozen one */
setInterval(tick, 10000);
</script>
</body>
</html>
